{id:'p2',ic:'⛰️',art:'mountain',q:"The impediment to action advances action. What stands in the way becomes the way.",by:"Marcus Aurelius",src:"Meditations",yr:"c. 170",vi:"Trở ngại của hành động lại thúc đẩy hành động. Thứ cản đường trở thành con đường.",note:"<b>What + V + becomes + N</b>: mệnh đề danh từ làm chủ ngữ (What stands in the way…). Rất hay để viết câu sâu sắc.",task:"Viết 1 câu theo mẫu “What ___ becomes ___.”"},
{id:'p3',ic:'🌙',art:'night',q:"We suffer more often in imagination than in reality.",by:"Seneca",src:"Letters to Lucilius",yr:"c. 65",vi:"Ta thường đau khổ trong tưởng tượng nhiều hơn trong thực tế.",note:"So sánh trạng từ: <b>more often in A than in B</b>. Chú ý hai vế song song (in imagination / in reality).",task:"Viết 1–2 câu so sánh “more ___ than ___” về nỗi lo của bạn."},
{id:'p4',ic:'👣',art:'road',q:"The journey of a thousand miles begins with a single step.",by:"Lao Tzu",src:"Tao Te Ching (translation)",yr:"c. 400 BC",vi:"Hành trình ngàn dặm bắt đầu từ một bước chân.",note:"<b>begin with</b> (bắt đầu bằng). Danh từ ghép <b>a thousand miles</b> và <b>a single step</b> tạo đối lập lớn – nhỏ.",task:"Viết 1–2 câu về “bước đầu tiên” của mục tiêu tiếng Anh, dùng begins with."},
{id:'p5',ic:'🐢',art:'garden',q:"It does not matter how slowly you go as long as you do not stop.",by:"Confucius (attributed)",src:"popular saying",yr:"",vi:"Đi chậm cũng không sao, miễn là đừng dừng lại.",note:"<b>It does not matter how/what…</b> (không quan trọng là…) và <b>as long as</b> (miễn là).",task:"Viết 1 câu dùng cả “It doesn’t matter…” và “as long as”."},
{id:'p6',ic:'🧭',art:'forest',q:"Go confidently in the direction of your dreams.",by:"Henry David Thoreau",src:"Walden",yr:"1854",vi:"Hãy tự tin đi theo hướng ước mơ của mình.",note:"Câu mệnh lệnh + trạng từ: <b>Go confidently</b>. <b>in the direction of</b> = theo hướng.",task:"Viết 1–2 câu khuyên bản thân, bắt đầu bằng một động từ mệnh lệnh + trạng từ."},
{id:'p7',ic:'🔨',art:'sunrise',q:"Well done is better than well said.",by:"Benjamin Franklin",src:"Poor Richard's Almanack",yr:"1737",vi:"Làm tốt hơn nói hay.",note:"Cấu trúc song song cực gọn: <b>Well done / well said</b>. Dùng phân từ II như danh từ.",task:"Viết 1 câu song song kiểu “___ is better than ___” về công việc."},
{id:'p8',ic:'😊',art:'field',q:"Happiness depends upon ourselves.",by:"Aristotle",src:"Nicomachean Ethics (translation)",yr:"c. 340 BC",vi:"Hạnh phúc phụ thuộc vào chính chúng ta.",note:"<b>depend on/upon</b> + tân ngữ; <b>ourselves</b> là đại từ phản thân, nhấn mạnh \"chính mình\".",task:"Viết 1–2 câu với “depends on” về thành công của một video."},
{id:'p9',ic:'🪞',art:'sea',q:"Be yourself; everyone else is already taken.",by:"Oscar Wilde",src:"attributed",yr:"",vi:"Hãy là chính mình; người khác đã có người làm rồi.",note:"Dấu chấm phẩy nối hai mệnh đề liên quan. <b>be taken</b> (đã có người dùng/chiếm) – bị động kiểu đời thường.",task:"Viết 1 câu có dấu chấm phẩy về phong cách làm nội dung của bạn."},
{id:'p10',ic:'🤔',art:'night',q:"The unexamined life is not worth living.",by:"Socrates",src:"Plato, Apology",yr:"c. 399 BC",vi:"Một cuộc đời không được suy xét thì không đáng sống.",note:"<b>be worth + V-ing</b> (đáng làm gì). Tiền tố <b>un-</b> + phân từ: unexamined, unexpected, unanswered.",task:"Viết 1–2 câu dùng “is (not) worth + V-ing”."},
{id:'p11',ic:'⏳',art:'rain',q:"This too shall pass.",by:"Persian proverb",src:"traditional",yr:"",vi:"Rồi chuyện này cũng sẽ qua.",note:"<b>shall</b> trang trọng, mang sắc thái chắc chắn. <b>too</b> = cũng.",task:"Viết 2 câu an ủi một người bạn đang gặp chuyện buồn."},
{id:'p12',ic:'🏔️',art:'mountain',q:"It always seems impossible until it's done.",by:"Nelson Mandela (attributed)",src:"attributed",yr:"",vi:"Mọi thứ luôn có vẻ bất khả thi cho đến khi nó được hoàn thành.",note:"<b>seem + adj</b> và <b>until it's done</b> (bị động hiện tại). Mẫu rất dễ dùng trong bài nói IELTS.",task:"Viết 1–2 câu về một việc từng tưởng không làm được nhưng bạn đã làm được."},
{id:'p13',ic:'💡',art:'forest',q:"In the middle of difficulty lies opportunity.",by:"Albert Einstein (attributed)",src:"attributed",yr:"",vi:"Giữa khó khăn là cơ hội.",note:"<b>Đảo ngữ với cụm giới từ</b>: In the middle of X lies Y (thay vì Y lies in the middle of X). Rất \"ăn điểm\" trong Writing.",task:"Viết 1 câu đảo ngữ “In/At ___ lies ___.”"},
{id:'p14',ic:'🧠',art:'garden',q:"Knowing yourself is the beginning of all wisdom.",by:"Aristotle (attributed)",src:"attributed",yr:"",vi:"Hiểu bản thân là khởi đầu của mọi sự khôn ngoan.",note:"<b>V-ing làm chủ ngữ</b>: Knowing yourself is… Động từ chia số ít.",task:"Viết 1 câu bắt đầu bằng V-ing làm chủ ngữ về việc học tiếng Anh."},
{id:'p15',ic:'🎯',art:'sunrise',q:"Whether you think you can, or you think you can't, you're right.",by:"Henry Ford (attributed)",src:"attributed",yr:"",vi:"Dù bạn nghĩ mình làm được hay không làm được, bạn đều đúng.",note:"<b>Whether … or …</b> (dù … hay …). Câu nghịch lý ngắn gọn, dễ nhớ.",task:"Viết 1 câu với “Whether ___ or ___, ___.”"},
{id:'p16',ic:'🔁',art:'river',q:"We are what we repeatedly do.",by:"Will Durant (on Aristotle)",src:"The Story of Philosophy",yr:"1926",vi:"Chúng ta là những gì ta làm lặp đi lặp lại.",note:"<b>what</b> mở đầu mệnh đề danh từ làm bổ ngữ: We are <b>what we do</b>.",task:"Viết 1 câu theo mẫu “___ is what ___.” về thói quen của bạn."},
{id:'p17',ic:'🧩',art:'snow',q:"Life is really simple, but we insist on making it complicated.",by:"Confucius (attributed)",src:"attributed",yr:"",vi:"Cuộc sống thật ra đơn giản, nhưng ta cứ cố làm nó phức tạp.",note:"<b>insist on + V-ing</b> (khăng khăng làm gì). <b>make it + adj</b>.",task:"Viết 1–2 câu dùng “insist on + V-ing”."},
{id:'p18',ic:'🗺️',art:'city',q:"Not all those who wander are lost.",by:"J. R. R. Tolkien",src:"The Fellowship of the Ring",yr:"1954",vi:"Không phải ai lang thang cũng là lạc lối.",note:"<b>Not all + N + V</b>: phủ định một phần (không phải tất cả). Khác với <i>All … are not</i>.",task:"Viết 1 câu “Not all ___ are ___.” về nghề sáng tạo nội dung."},
{id:'p19',ic:'🍃',art:'field',q:"Simplicity is the ultimate sophistication.",by:"Leonardo da Vinci (attributed)",src:"attributed",yr:"",vi:"Sự đơn giản là đỉnh cao của tinh tế.",note:"Danh từ trừu tượng hậu tố <b>-ity / -tion</b>: simplicity, sophistication. <b>ultimate</b> = tối thượng.",task:"Viết 1–2 câu về thiết kế thumbnail, dùng 2 danh từ trừu tượng."},
{id:'p20',ic:'⛵',art:'sea',q:"We cannot direct the wind, but we can adjust the sails.",by:"Proverb",src:"traditional",yr:"",vi:"Ta không điều khiển được gió, nhưng có thể chỉnh cánh buồm.",note:"Đối lập <b>cannot … but can …</b>. Ẩn dụ rất hợp để nói về thuật toán YouTube.",task:"Viết 1 câu “We can’t ___, but we can ___.” về thuật toán YouTube."}
];

const FILMS=[
{id:'f1',art:'rain',emo:'☕',title:'Cà phê ngày mưa',genre:'Lãng mạn · gặp gỡ',chars:[{n:'Lin',c:'#E87A90'},{n:'Sam',c:'#4F7CD8'}],lines:[
[1,"Excuse me, is this seat taken? Every other table is full.","Xin lỗi, ghế này có ai ngồi chưa? Các bàn khác kín hết rồi."],
[0,"Go ahead. The rain's not stopping any time soon anyway.","Cứ ngồi đi. Đằng nào mưa cũng chưa tạnh sớm đâu."],
[1,"Thanks. I was wondering… is that a history book you're reading?","Cảm ơn. Tôi đang thắc mắc… cậu đang đọc sách lịch sử à?"],
[0,"It is. I'm writing a script about ancient trade routes.","Đúng vậy. Tôi đang viết kịch bản về các tuyến thương mại cổ đại."],
[1,"No way. I've been obsessed with the Silk Road since I was a kid.","Không thể nào. Tôi mê Con đường Tơ lụa từ hồi bé."],
[0,"Then you might be my first audience. Want to hear the opening?","Vậy có khi cậu là khán giả đầu tiên của tôi. Muốn nghe đoạn mở đầu không?"],
[1,"Only if I can buy you another coffee in return.","Chỉ khi tôi được mời lại cậu một ly cà phê."],
[0,"Deal. But I warn you, I get carried away when I talk about history.","Chốt. Nhưng báo trước, nói về lịch sử là tôi hay cuốn theo lắm."]],
keys:[["Is this seat taken?","Ghế này có ai ngồi chưa?","Câu bắt chuyện lịch sự ở quán, xe buýt, sự kiện."],["I was wondering…","Tôi đang thắc mắc…","Mở đầu câu hỏi nhẹ nhàng, lịch sự hơn hỏi thẳng."],["I've been obsessed with … since …","Tôi mê … từ khi …","Hiện tại hoàn thành + since: sở thích kéo dài đến nay."],["get carried away","bị cuốn theo, hăng quá","Dùng khi nói/làm quá nhiều vì hào hứng."]]},
{id:'f2',art:'city',emo:'🕵️',title:'Vụ án chiếc bánh mất tích',genre:'Trinh thám · hài',chars:[{n:'Detective Ray',c:'#5B6B8C'},{n:'Mia',c:'#E0A030'}],lines:[
[0,"The cake was here at noon. By three, it had vanished.","Lúc trưa chiếc bánh còn ở đây. Đến ba giờ thì nó đã biến mất."],
[1,"Maybe someone just got hungry, Detective.","Có lẽ ai đó chỉ đói bụng thôi, thám tử."],
[0,"Hungry people leave crumbs. This thief left nothing.","Người đói thì để lại vụn bánh. Tên trộm này chẳng để lại gì."],
[1,"So it must have been someone careful… someone who plans ahead.","Vậy chắc hẳn là người cẩn thận… người biết tính trước."],
[0,"Exactly. And who in this office plans everything?","Chính xác. Và ai trong văn phòng này lên kế hoạch cho mọi thứ?"],
[1,"Wait… you can't seriously suspect me.","Khoan… anh không nghiêm túc nghi tôi đấy chứ."],
[0,"I'm not accusing you. I'm just asking where you were at two o'clock.","Tôi không buộc tội cô. Tôi chỉ hỏi lúc hai giờ cô ở đâu."],
[1,"I was in a meeting. You can check the calendar if you don't believe me.","Tôi đang họp. Anh có thể kiểm tra lịch nếu không tin."]],
keys:[["It had vanished.","Nó đã biến mất.","Quá khứ hoàn thành: việc xảy ra trước một mốc quá khứ (by three)."],["It must have been…","Chắc hẳn là…","Suy luận chắc chắn về quá khứ."],["plan ahead","lên kế hoạch trước",""],["I'm not accusing you.","Tôi không buộc tội bạn.","Làm dịu tình huống căng thẳng."]]},
{id:'f3',art:'night',emo:'🚀',title:'Trạm vũ trụ Aurora',genre:'Khoa học viễn tưởng',chars:[{n:'Captain Vale',c:'#3A7BD5'},{n:'Engineer Tam',c:'#2EAD7A'}],lines:[
[0,"Report, Tam. How bad is it?","Báo cáo đi, Tam. Tình hình tệ đến mức nào?"],
[1,"Bad. We're losing oxygen faster than I expected.","Tệ lắm. Ta đang mất oxy nhanh hơn tôi dự đoán."],
[0,"How long do we have?","Ta còn bao lâu?"],
[1,"At this rate, about forty minutes. Maybe less.","Với tốc độ này, khoảng bốn mươi phút. Có thể ít hơn."],
[0,"Then we're running out of time. What do you need?","Vậy ta sắp hết thời gian rồi. Cậu cần gì?"],
[1,"Someone has to seal the outer hatch manually. It's risky.","Phải có người đóng kín cửa ngoài bằng tay. Rất mạo hiểm."],
[0,"I'll do it. You keep the reactor stable, no matter what happens.","Tôi sẽ làm. Cậu giữ lò phản ứng ổn định, dù có chuyện gì xảy ra."],
[1,"Captain… be careful. We can't afford to lose you.","Thuyền trưởng… cẩn thận. Chúng tôi không thể mất anh được."]],
keys:[["faster than I expected","nhanh hơn tôi dự đoán","So sánh + mệnh đề: than I expected / than I thought."],["At this rate","Với tốc độ này","Rất hay dùng khi nói về xu hướng số liệu."],["We're running out of time.","Ta sắp hết thời gian.","run out of + N: cạn, hết."],["can't afford to …","không thể để mất / không đủ khả năng …",""]]},
{id:'f4',art:'forest',emo:'🌲',title:'Linh hồn khu rừng',genre:'Phiêu lưu · kỳ ảo',chars:[{n:'Aki',c:'#E07A3F'},{n:'Forest Spirit',c:'#4E9B6B'}],lines:[
[0,"Hello? Is anyone there? I think I'm lost.","Xin chào? Có ai không? Hình như tôi bị lạc."],
[1,"Not lost. The forest brought you here for a reason.","Không phải lạc. Khu rừng đưa ngươi đến đây là có lý do."],
[0,"A reason? I was just looking for my grandfather's old house.","Lý do á? Tôi chỉ đang tìm ngôi nhà cũ của ông tôi."],
[1,"He used to visit me every summer. He told me you would come one day.","Ông ấy từng đến thăm ta mỗi mùa hè. Ông nói một ngày ngươi sẽ đến."],
[0,"He never mentioned you… not even once.","Ông chưa từng nhắc đến ngài… dù chỉ một lần."],
[1,"Some secrets are only meant to be found, not told.","Có những bí mật chỉ để được tìm thấy, không phải để kể."],
[0,"Then will you show me the way?","Vậy ngài sẽ chỉ đường cho tôi chứ?"],
[1,"Follow the fireflies. And whatever you hear, don't look back.","Đi theo đàn đom đóm. Và dù nghe thấy gì, đừng ngoảnh lại."]],
keys:[["for a reason","có lý do",""],["He used to …","Ông ấy từng (thường) …","used to + V: thói quen trong quá khứ, nay không còn."],["not even once","dù chỉ một lần cũng không","Nhấn mạnh phủ định."],["whatever you hear","dù bạn nghe thấy gì","whatever/whenever/wherever + mệnh đề."]]},
{id:'f5',art:'city',emo:'💼',title:'Buổi phỏng vấn bất ngờ',genre:'Hài · công sở',chars:[{n:'Mai',c:'#E87A90'},{n:'Interviewer Josh',c:'#4F7CD8'}],lines:[
[1,"Please, have a seat. So, tell me a bit about… wait. Mai? From high school?","Mời ngồi. Vậy, kể tôi nghe một chút về… khoan. Mai? Bạn cấp ba?"],
[0,"Josh?! I didn't see that coming. You're the interviewer?","Josh?! Không ngờ luôn. Cậu là người phỏng vấn à?"],
[1,"Apparently. Okay, let's keep it professional. Why do you want this job?","Có vẻ vậy. Được rồi, chuyên nghiệp nhé. Vì sao bạn muốn công việc này?"],
[0,"I've been writing scripts for three years, and I'm ready for a bigger challenge.","Tôi viết kịch bản được ba năm và tôi sẵn sàng cho thử thách lớn hơn."],
[1,"Impressive. You used to copy my homework, though.","Ấn tượng đấy. Dù hồi đó cậu hay chép bài tập của tôi."],
[0,"That was one time! And I paid you back with snacks.","Có đúng một lần! Và tôi đã trả cậu bằng đồ ăn vặt rồi."],
[1,"Fair enough. What would you say is your biggest strength?","Công bằng đấy. Theo bạn điểm mạnh lớn nhất của bạn là gì?"],
[0,"I turn complicated history into stories people actually want to watch.","Tôi biến lịch sử phức tạp thành câu chuyện người ta thật sự muốn xem."]],
keys:[["I didn't see that coming.","Tôi không ngờ tới.","Phản ứng khi bất ngờ, rất hay dùng."],["Let's keep it professional.","Chuyên nghiệp nhé.",""],["I'm ready for a bigger challenge.","Tôi sẵn sàng cho thử thách lớn hơn.","Câu trả lời phỏng vấn kinh điển."],["Fair enough.","Cũng hợp lý / công bằng đấy.","Đồng ý một phần, giọng thoải mái."]]},
{id:'f6',art:'road',emo:'🚉',title:'Sân ga chia tay',genre:'Tâm lý · tình bạn',chars:[{n:'Linh',c:'#9C6ADE'},{n:'Hoa',c:'#E0A030'}],lines:[
[0,"I can't believe you're actually leaving tomorrow.","Mình không tin là mai cậu đi thật."],
[1,"Me neither. It still doesn't feel real.","Mình cũng vậy. Vẫn chưa thấy thật."],
[0,"Promise me you'll keep in touch. Not just one message a year.","Hứa với mình là sẽ giữ liên lạc nhé. Không phải mỗi năm một tin."],
[1,"I promise. Besides, the time difference is only five hours.","Mình hứa. Với lại lệch múi giờ chỉ năm tiếng thôi."],
[0,"Only five hours, she says. That's the whole of my sleep.","“Chỉ” năm tiếng, cô ấy nói vậy. Bằng cả giấc ngủ của mình đấy."],
[1,"Then I'll call during your lunch break. Happy?","Vậy mình sẽ gọi vào giờ nghỉ trưa của cậu. Vui chưa?"],
[0,"Happy. Now go before I start crying in public.","Vui. Giờ đi đi trước khi mình khóc giữa chốn đông người."],
[1,"Too late. We're both crying. Come here.","Muộn rồi. Cả hai đứa đều đang khóc. Lại đây nào."]],
keys:[["keep in touch","giữ liên lạc",""],["It still doesn't feel real.","Vẫn chưa thấy thật.","Diễn tả cảm xúc khi chuyện lớn xảy ra."],["Besides, …","Với lại, …","Thêm một lý do nữa."],["before I start crying","trước khi tôi bắt đầu khóc","before + mệnh đề hiện tại (dù nói về tương lai)."]]},
{id:'f7',art:'night',emo:'🍜',title:'Quán mì nửa đêm',genre:'Đời thường · chữa lành',chars:[{n:'Chef Bao',c:'#C9733A'},{n:'Customer',c:'#5B6B8C'}],lines:[
[1,"Are you still open? I know it's late.","Quán còn mở không ạ? Cháu biết là muộn rồi."],
[0,"For tired people, I'm always open. Rough day?","Với người mệt mỏi thì quán luôn mở. Hôm nay vất vả hả?"],
[1,"Rough week, to be honest. My project got cancelled.","Nói thật thì cả tuần vất vả. Dự án của cháu bị hủy."],
[0,"I'm sorry to hear that. Here, the broth has been simmering since noon.","Tiếc quá. Đây, nước dùng ninh từ trưa đấy."],
[1,"Wow… this tastes exactly like my grandmother's.","Ôi… vị y hệt món bà cháu nấu."],
[0,"Good food reminds us who we are. Projects come and go.","Đồ ăn ngon nhắc ta nhớ mình là ai. Dự án thì đến rồi đi."],
[1,"I needed to hear that. Thank you.","Cháu cần nghe câu đó. Cảm ơn bác."],

const CO_RULE=`LANGUAGE RULE (very important): every explanation field ("praise","type","why","better_why","reason","tip") MUST be written in Vietnamese (tiếng Việt có dấu). Never write explanations in English; only the English words being discussed stay in English.

function hiFix(a,b){if(!a)return esc(b);const f=t=>t.toLowerCase().replace(/[’]/g,"'").replace(/[^a-z0-9'-]/g,'');const B=b.split(/\s+/).filter(Boolean),A=a.split(/\s+/).filter(Boolean),x=B.map(f),y=A.map(f),n=x.length,m=y.length;
 const dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=x[i]===y[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
 const ok=new Array(n).fill(false);let i=0,j=0;while(i<n&&j<m){if(x[i]===y[j]){ok[i]=true;i++;j++}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++}
 return B.map((t,k)=>ok[k]?esc(t):`<mark class="co-add">${esc(t)}</mark>`).join(' ')}

 ${r.corrected&&errs.length?`<div class="co-fix"><div class="xs mut">Câu đã sửa <span class="co-leg">chữ tô vàng là chỗ được sửa</span></div><div class="row" style="gap:8px;align-items:flex-start"><div class="en sp">${hiFix(o.orig||'',r.corrected)}</div>${spk(r.corrected,.9)}</div></div>`:''}

 ${errs.map((e,k)=>`<div class="co-err"><div class="row" style="gap:8px;flex-wrap:wrap"><span class="co-n">${k+1}</span>${e.type?`<span class="co-t">${esc(e.type)}</span>`:''}<span class="co-w">${esc(e.wrong||'(thiếu)')}</span><span class="mut">→</span><span class="co-r">${esc(e.right||'')}</span></div>${e.why?`<div class="co-why">${esc(e.why)}</div>`:''}${e.rule?`<div class="co-rule">📐 ${esc(e.rule)}</div>`:''}${e.example?`<div class="co-ex"><span class="sp">Ví dụ: <i>${esc(e.example)}</i></span>${spk(e.example,.9)}</div>`:''}</div>`).join('')}

const FUNCW=new Set("a an the of to have has had 've is are was were be been am and or but in on at for from with will would can could do does did it that this as by".split(' '));
function whyChunks(ref,typed){const xp=t=>t.replace(/[’]/g,"'").replace(/\b(\w+)'ve\b/gi,'$1 have').replace(/\b(\w+)'re\b/gi,'$1 are').replace(/\bI'm\b/gi,'I am').replace(/\b(\w+)'ll\b/gi,'$1 will');ref=xp(ref);typed=xp(typed);const f=t=>t.toLowerCase().replace(/[’]/g,"'").replace(/[^a-z0-9'-]/g,'');const A=ref.split(/\s+/).filter(Boolean),B=typed.split(/\s+/).filter(Boolean),a=A.map(f),b=B.map(f),n=a.length,m=b.length;
 const dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
 const out=[];let c={r:[],t:[]};const flush=()=>{if(c.r.length||c.t.length)out.push(c);c={r:[],t:[]}};let i=0,j=0;
 while(i<n||j<m){if(i<n&&j<m&&a[i]===b[j]){flush();i++;j++}else if(j>=m||(i<n&&dp[i+1][j]>=dp[i][j+1])){c.r.push(A[i]);i++}else{c.t.push(B[j]);j++}}flush();return out}
function whyReason(c){const f=t=>t.toLowerCase().replace(/[’]/g,"'").replace(/[^a-z0-9' -]/g,'');const R=f(c.r.join(' ')),T=f(c.t.join(' '));const out=[];
 const ex=s=>s.replace(/'ve\b/g,' have').replace(/'m\b/g,' am').replace(/'re\b/g,' are').replace(/'ll\b/g,' will').replace(/'d\b/g,' would').replace(/n't\b/g,' not').replace(/\s+/g,' ').trim();
 const suf=s=>s.split(/[\s-]+/).map(w=>w.replace(/(ies|es|s|ed|ing)$/,'').replace(/e$/,'')).join('');const st=s=>s.replace(/[\s-]/g,'');
 if(!c.t.length){out.push(c.r.every(w=>FUNCW.has(f(w)))?'Đây là từ chức năng (a, the, of, to, have…). Người bản xứ đọc rất nhẹ và lướt (dạng yếu – weak form) nên rất dễ bị bỏ sót.':'Bạn bỏ sót đoạn này. Có thể người đọc nối âm với từ đứng trước nên nghe như dính liền thành một từ.');return out}
 if(!c.r.length){out.push('Bạn thêm từ không có trong câu gốc, có thể do đoán theo thói quen ngữ pháp. Chỉ ghi những gì thật sự nghe thấy.');return out}
 if(ex(R)===ex(T)){out.push(`Câu gốc đọc dạng ${/'/.test(R)?'rút gọn':'đầy đủ'} “${c.r.join(' ')}”, bạn viết dạng ${/'/.test(T)?'rút gọn':'đầy đủ'}. Nghĩa giống nhau, nhưng khi chép chính tả hãy để ý có nghe rõ âm /hæv/, /æm/… hay chỉ là âm nhỏ /v/, /m/ dính vào chủ ngữ.`);return out}
 if(st(R)===st(T))out.push('Bạn nghe đúng âm nhưng viết sai cách tách/ghép từ. Đây là từ ghép (có gạch nối hoặc viết liền), người bản xứ đọc liền như một từ, ví dụ hands-on, long-form, well-known.');
 else if(suf(R)===suf(T)){if(/-/.test(R)!==/-/.test(T))out.push('Có từ ghép gạch nối (đọc liền như một từ).');out.push('Âm cuối -s / -es / -ed / -ing được đọc rất nhẹ hoặc nối sang từ sau nên khó nghe. Mẹo: dùng ngữ pháp để tự kiểm tra – danh từ số ít hay số nhiều? Đếm được hay không đếm được (experience = kinh nghiệm thì không thêm s)? Thì quá khứ hay hiện tại?')}
 else{const L=(x,y)=>{const d=Array.from({length:x.length+1},(_,i)=>[i]);for(let j=1;j<=y.length;j++)d[0][j]=j;for(let i=1;i<=x.length;i++)for(let j=1;j<=y.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(x[i-1]===y[j-1]?0:1));return d[x.length][y.length]};
  out.push(L(st(R),st(T))<=Math.max(2,st(R).length*.25)?'Bạn nghe gần đúng nhưng sai chính tả hoặc nhầm với một từ phát âm gần giống. Bấm nghe chậm 🐢 rồi so lại từng âm.':'Bạn nghe nhầm từ. Thường do nối âm (phụ âm cuối dính sang nguyên âm đầu từ sau) hoặc do trọng âm rơi vào âm tiết khác bạn nghĩ. Nghe chậm 🐢 và nhại lại 2–3 lần.')}
 return out}
function localWhy(ref,typed){return whyChunks(ref,typed).slice(0,5).map(c=>({heard:c.t.join(' '),actual:c.r.join(' '),reason:whyReason(c).join(' ')}))}

/* ---------- motion: reveal on scroll, parallax, page fade ---------- */
let RIO=null;const RM=()=>window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function motion(){if(RM()||!('IntersectionObserver' in window))return;RIO=RIO||new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');RIO.unobserve(e.target)}}),{rootMargin:'0px 0px -6% 0px'});
 let k=0;document.querySelectorAll('#root .ex-card,#root .qcard,#root .fcard,#root .poster,#root .tc,#root .scard,#root h2.dsec').forEach(el=>{if(el.classList.contains('rv'))return;el.classList.add('rv');el.style.setProperty('--rd',Math.min(k++,8)*55+'ms');RIO.observe(el)});setTimeout(()=>document.querySelectorAll('.rv:not(.in)').forEach(el=>{if(el.getBoundingClientRect().top<innerHeight*1.1)el.classList.add('in')}),900)}
let PXr=0;function px(e){if(RM())return;cancelAnimationFrame(PXr);PXr=requestAnimationFrame(()=>{const y=scrollY;document.querySelectorAll('[data-px]').forEach(h=>{const r=h.getBoundingClientRect();if(r.bottom<0||r.top>innerHeight)return;const im=h.querySelector('.hx-img');if(!im)return;let mx=0,my=0;if(e&&e.clientX!=null&&r.top<e.clientY&&e.clientY<r.bottom){mx=(e.clientX/innerWidth-.5)*-14;my=((e.clientY-r.top)/r.height-.5)*-10}im.style.transform=`translate3d(${mx}px,${my+Math.max(-40,Math.min(40,-r.top*.12))}px,0) scale(1.08)`})})}
addEventListener('scroll',()=>px(),{passive:true});addEventListener('pointermove',e=>{if(e.pointerType==='mouse')px(e)},{passive:true});
addEventListener('hashchange',()=>{const r=document.getElementById('root');if(r&&!RM()){r.classList.remove('pgin');void r.offsetWidth;r.classList.add('pgin')}});
function decoratePage(){try{skinBg();if(route!=='today'){const pg=document.querySelector('#root .page');if(pg&&!pg.querySelector('.pgband'))pg.insertAdjacentHTML('afterbegin',bandHTML())}
 if(!document.getElementById('imgcredit')){const f=document.createElement('div');f.id='imgcredit';f.innerHTML='Ảnh minh họa: <a href="https://unsplash.com/license" target="_blank" rel="noopener">Unsplash</a> (giấy phép miễn phí)';document.body.appendChild(f)}
 motion();px()}catch(e){}}

 {title:'IELTS Writing Task 2',goal:'Viết bài nghị luận 250 từ có luận điểm rõ, ví dụ cụ thể.',task:'Viết bài Task 2 (250 từ): “Some people think social media does more harm than good to young people. To what extent do you agree?”',days:[RN('Mở bài Task 2','It is often argued that ___. This essay will ___.','Mở bài 2 câu: giới thiệu vấn đề + quan điểm/hướng bài.','Viết','Viết mở bài cho đề: “Working from home is better than working in an office. Discuss.”'),RN('Câu chủ đề & ví dụ','One major reason is that ___. For instance, ___.','Đoạn thân bài chuẩn: câu chủ đề – giải thích – ví dụ.','Viết','Viết 1 đoạn thân bài 4 câu ủng hộ làm việc từ xa.'),RN('Nhượng bộ','Although ___, ___. / While it is true that ___, ___.','Thừa nhận ý ngược lại rồi phản bác – dấu hiệu bài viết band 6.5+.','Viết','Viết 2 câu nhượng bộ về tác hại của AI với nghề sáng tạo nội dung.'),RN('Collocation học thuật','have a significant impact on ___ / play a crucial role in ___','Cụm từ đi liền tự nhiên giúp tăng điểm Lexical Resource.','Viết','Viết 3 câu về giáo dục trực tuyến, mỗi câu dùng một collocation hôm nay.'),RN('Kết luận','In conclusion, I firmly believe that ___.','Kết bài: nhắc lại quan điểm bằng từ khác, không thêm ý mới.','Viết','Viết kết bài 2 câu cho đề làm việc từ xa.'),RN('Viết trọn bài Task 2','It is often argued that ___. In conclusion, ___.','Lập dàn ý 5 phút rồi viết bài hoàn chỉnh.','Viết','Viết mở bài + 1 thân bài (khoảng 120 từ) cho đề về mạng xã hội.')]},

const dInfo=d=>{const i=d-1,cyc=Math.floor(i/84),wi=Math.floor((i%84)/7),pos=i%7;const wk=ROAD[wi];return {wk,wi,pos,cyc,rev:pos===6,e:pos<6?wk.days[pos]:wk.days[5],ph:PHASES.find(p=>wi+1>=p.weeks[0]&&wi+1<=p.weeks[1])}};
function mkL(d,e,pk,f){const L={id:'rd'+d,title:e.t,li:0,u:{name:`Tuần ${f.wi+1}: ${f.wk.title}`,emo:'🗺️',color:'#5B7DB8',dark:'#41609A',ui:f.wi},words:(pk.words||[]).slice(0,6),st:{p:e.p,vi:esc(e.v),ex:(pk.ex||[]).slice(0,3)},s:(pk.s||[]).slice(0,4)};
 L.words.forEach(w=>{if(!WORD[w[0]])WORD[w[0]]={w:w[0],vi:w[1],ex:w[2],l:L}});return L}
function roadLesson(d){const f=dInfo(d),e=f.e;const pk=S.dpack&&S.dpack[d]&&S.dpack[d].lesson;
 if(e.L!=null&&!f.rev)return LESSONS[e.L];
 if(f.rev){const last=[...f.wk.days].reverse().find(x=>x.L!=null);return last?LESSONS[last.L]:roadLesson(d-1)}
 if(pk&&pk.words&&pk.s&&pk.s.length>=3&&pk.ex&&pk.ex.length)return mkL(d,e,pk,f);
 return LESSONS[(d-1)%LESSONS.length]}
const needGen=d=>{const f=dInfo(d);return !f.rev&&f.e.L==null&&!(S.dpack&&S.dpack[d]&&S.dpack[d].lesson)&&!!caps.sample&&!(TD.lskip&&TD.lskip[d])};
async function genLesson(d){const f=dInfo(d),e=f.e;TD.lbusy=true;TD.lerr=null;render();
 try{const r=await ai(`Create a short English lesson for a Vietnamese learner (VSTEP B2, IELTS 5.5 aiming 6.5). About her: ${ME}
Lesson title (Vietnamese): "${e.t}". Target pattern: "${e.p}". What it is for: ${e.v}. Skill focus: ${e.f}.
Return ONLY JSON: {"words":[["English word or collocation","nghĩa tiếng Việt","an example sentence using it, about her work or daily life"]],"ex":[["an example sentence using the target pattern","Vietnamese translation"]],"s":[["a natural practice sentence (8-16 words) using the pattern or the words","Vietnamese translation"]]} with exactly 5 words (B2-C1, useful for this lesson), 2 ex and 4 s.`);
  if(!r||!Array.isArray(r.words)||r.words.length<3||!Array.isArray(r.s)||r.s.length<3||!Array.isArray(r.ex)||!r.ex.length)throw {message:'AI trả về chưa đủ nội dung, bấm thử lại nhé.'};
  S.dpack[d]=Object.assign(S.dpack[d]||{},{lesson:r});save();delete DAYW[d]}catch(e){TD.lerr=aiMsg(e)||e.message}
 TD.lbusy=false;render()}
function genScreen(d,P,T,L){const f=dInfo(d);if(!TD.lbusy&&!TD.lerr)setTimeout(()=>{if(needGen(d)&&!TD.lbusy)genLesson(d)},30);
 return `<div class="page" style="max-width:900px">${heroHTML(P,T,L,d)}<div class="card" style="text-align:center;padding:30px"><div style="font-size:40px">🗺️</div><h3>Tuần ${f.wi+1} · Ngày ${f.pos+1}: ${esc(f.e.t)}</h3><p class="mut">Khung câu: <b>${esc(f.e.p)}</b></p>${TD.lerr?`<div class="fbk no">${esc(TD.lerr)}</div><div class="row" style="justify-content:center;margin-top:10px"><button class="btn s" data-act="lgen">Thử lại</button><button class="btn gh s" data-act="lskip">Học bài dự phòng</button></div>`:`<div class="sm mut"><span class="spin"></span> ${P.emo} AI đang soạn bài học hôm nay cho bạn (khoảng 10 giây)…</div>`}</div></div>`}
function buildReview(d){const f=dInfo(d);const list=[];const add=(sk,arr)=>arr.forEach((x,j)=>list.push(Object.assign(x,{sk,sec:j?null:sk})));
 add('rev',reviewItems(d));add('write',[{k:'write',prompt:f.wk.task,frame:'Dùng ít nhất 3 cấu trúc đã học trong tuần',ex:[]}]);add('role',[{k:'role',R:dayRole(d),d}]);
 const rec=dayRec(d);list.forEach(x=>{if(rec.sec[x.sk]&&x.k!=='role'){x.done=true;x.pre=true}});return list}
/* register words of saved AI lessons on load */
(function(){try{DS();Object.keys(S.dpack).forEach(k=>{const p=S.dpack[k]&&S.dpack[k].lesson;if(p){const f=dInfo(+k);if(f.e&&f.e.L==null)mkL(+k,f.e,p,f)}})}catch(e){}})();

function vPlan(){DS();const cd=curDay();const cf=dInfo(cd);const doneDays=Object.keys(S.days).filter(k=>S.days[k].done).length;const P=persona(),sk=skinOf(P);
 const dayBtn=(d,label,sub)=>{const dn=S.days[d]&&S.days[d].done;const now=d===cd;return `<button class="rd-day ${dn?'dn':''} ${now?'now':''}" data-act="dday2" data-d="${d}"><span class="rd-n">${dn?'✓':now?'▶':d}</span><span class="rd-t">${esc(label)}</span>${sub?`<span class="rd-s">${esc(sub)}</span>`:''}</button>`};
 return `<div class="page" style="max-width:1000px"><span class="tag">Lộ trình riêng của Mai Chi</span><h1>12 tuần: B2 (IELTS 5.5) → 6.5 & tiếng Anh làm việc remote</h1>
 <p class="mut" style="max-width:760px">Thiết kế cho đúng điểm yếu của bạn: biết từ nhưng khó ghép thành câu, viết và nghe còn yếu. Vì vậy ngày nào cũng có <b>viết</b> và <b>nói</b> (bắt não “xuất” ra câu), từ và cấu trúc cũ được <b>ôn cách quãng</b>, và nội dung bám vào công việc thật: YouTube, kịch bản, khách hàng, phỏng vấn remote.</p>
 <div class="rd-stats"><div class="card"><b>${cd}</b><span>ngày hiện tại</span></div><div class="card"><b>Tuần ${cf.wi+1}</b><span>${esc(cf.wk.title)}</span></div><div class="card"><b>${Math.round(doneDays/84*100)}%</b><span>${doneDays}/84 ngày đã xong</span></div><div class="card"><b>~45′</b><span>mỗi ngày · 6 học + 1 ôn</span></div></div>
 <div class="card rd-how"><h3>Một ngày học trông thế nào</h3><div class="rd-flow"><span>🔁 Ôn bài cũ<small>5′</small></span><span>📘 Học cấu trúc + từ<small>8′</small></span><span>🎧 Nghe chép<small>7′</small></span><span>📖 Đọc<small>7′</small></span><span>🗣️ Nói<small>8′</small></span><span>✍️ Viết + AI chữa<small>10′</small></span><span>💬 Chat nhân vật<small>thưởng</small></span></div><p class="sm mut" style="margin:10px 0 0">Gợi ý chia nhỏ: sáng (ôn + học mới), trưa (nghe + đọc), tối (nói + viết). Ngày thứ 7 mỗi tuần là <b>ngày ôn</b>: 12 câu kiểm tra những gì bạn hay sai + 1 bài viết lớn của tuần.</p></div>
 ${PHASES.map(ph=>`<section class="rd-ph"><div class="rd-phh" data-px>${imgT(pickU(skinPool(sk),ph.n*13),1400,360,'hx-img')}<div class="pgb-sh"></div><div class="rd-phin"><span class="pgb-k">Giai đoạn ${ph.n} · Tuần ${ph.weeks[0]}–${ph.weeks[1]} · Mục tiêu band ${esc(ph.band)}</span><h2>${esc(ph.name)}</h2><p>${esc(ph.out)}</p></div></div>
  ${ROAD.slice(ph.weeks[0]-1,ph.weeks[1]).map((wk,j)=>{const wi=ph.weeks[0]-1+j,base=wi*7;const wdone=[1,2,3,4,5,6,7].filter(k=>S.days[base+k]&&S.days[base+k].done).length;return `<div class="card rd-wk ${cf.wi===wi?'cur':''}"><div class="row" style="align-items:flex-start"><div class="sp"><span class="tag">Tuần ${wi+1}${cf.wi===wi?' · bạn đang ở đây':''}</span><h3 style="margin:2px 0 4px">${esc(wk.title)}</h3><div class="sm mut">${esc(wk.goal)}</div></div><span class="pill">${wdone}/7</span></div>
   <div class="rd-days">${wk.days.map((e,k)=>{const L=e.L!=null?LESSONS[e.L]:null;return dayBtn(base+k+1,L?L.title:e.t,L?L.st.p:e.p)}).join('')}${dayBtn(base+7,'Ôn tuần + bài viết lớn','✍️ '+wk.task.slice(0,70)+'…')}</div></div>`}).join('')}</section>`).join('')}
 <p class="sm mut">Học hết 84 ngày, lộ trình tự quay lại vòng 2 với chủ đề giao tiếp và bài đọc mới. Bạn có thể học vượt hoặc quay lại bất kỳ ngày nào bằng cách bấm vào ngày đó.</p></div>`}

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>English cho Mai Chi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
<style>
:root{--pri:#2557D6;--pri-d:#1B44AE;--pri-l:#EAF0FD;--ink:#16213A;--ink2:#3C4761;--mut:#6B7489;--line:#E3E7EF;--bg:#F7F8FB;--card:#fff;--gr:#16A34A;--gr-l:#E7F7EE;--rd:#DC3545;--rd-l:#FDECEE;--am:#C27C0E;--am-l:#FFF6E3;--r:14px;--sh:0 1px 2px rgba(22,33,58,.05),0 4px 16px rgba(22,33,58,.06);--sh2:0 2px 4px rgba(22,33,58,.06),0 12px 32px rgba(22,33,58,.12)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Be Vietnam Pro',system-ui,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--pri);text-decoration:none}
h1{font-size:30px;line-height:1.25;font-weight:800;letter-spacing:-.02em;margin:0 0 8px}
h2{font-size:22px;line-height:1.3;font-weight:800;letter-spacing:-.01em;margin:36px 0 12px}
h3{font-size:17px;font-weight:700;margin:0 0 6px}
p{margin:0 0 12px}
.mut{color:var(--mut)}.sm{font-size:14px}.xs{font-size:12.5px}
.row{display:flex;align-items:center;gap:12px}.sp{flex:1}.wrap{flex-wrap:wrap}
/* header */
.hd{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.hd .in{max-width:1240px;margin:0 auto;height:64px;padding:0 20px;display:flex;align-items:center;gap:22px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.logo i{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#2557D6,#7C4DFF);display:grid;place-items:center;color:#fff;font-style:normal;font-size:15px}
.nav{display:flex;gap:4px;height:100%}
.nav a{display:flex;align-items:center;padding:0 12px;color:var(--ink2);font-weight:600;font-size:15px;position:relative;transition:color .15s}
.nav a:hover{color:var(--ink)}
.nav a.on{color:var(--pri)}
.nav a.on:after{content:'';position:absolute;left:12px;right:12px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--pri)}
.nav .bd{margin-left:6px;background:var(--rd);color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:0 6px;line-height:18px}
.chipst{display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px;padding:6px 10px;border-radius:99px;background:var(--bg)}
.av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#FFB86B,#FF6B8B);color:#fff;display:grid;place-items:center;font-weight:800}
.btn.mb{display:none}
/* layout */
.page{max-width:1240px;margin:0 auto;padding:28px 20px 80px;animation:enter .35s ease both}
@keyframes enter{from{opacity:0;transform:translateY(10px)}}
.grid2{display:grid;grid-template-columns:1fr 340px;gap:28px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--sh)}
.lift{transition:transform .2s,box-shadow .2s}.lift:hover{transform:translateY(-3px);box-shadow:var(--sh2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:10px;background:var(--pri);color:#fff;font-weight:700;font-size:15px;transition:background .15s,transform .1s,box-shadow .15s;box-shadow:0 1px 2px rgba(37,87,214,.3)}
.btn:hover{background:var(--pri-d)}.btn:active{transform:scale(.98)}
.btn.out{background:#fff;color:var(--pri);border:1.5px solid var(--pri);box-shadow:none}.btn.out:hover{background:var(--pri-l)}
.btn.gh{background:#fff;color:var(--ink2);border:1px solid var(--line);box-shadow:none}.btn.gh:hover{background:var(--bg)}
.btn.s{padding:7px 13px;font-size:13.5px;border-radius:8px}
.btn.gr{background:var(--gr)}.btn.gr:hover{background:#12873D}
.btn:disabled{opacity:.45;pointer-events:none}
.pbar{height:8px;background:#E8ECF4;border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--pri);border-radius:99px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mut)}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--pri-l);color:var(--pri)}
.pill.g{background:var(--gr-l);color:var(--gr)}.pill.a{background:var(--am-l);color:var(--am)}.pill.r{background:var(--rd-l);color:var(--rd)}
.spk{width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;background:var(--pri-l);color:var(--pri);flex:none;transition:transform .15s,background .15s}
.spk:hover{background:#D9E4FB;transform:scale(1.06)}
.spk.pl{animation:ring 1s ease-out infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(37,87,214,.35)}100%{box-shadow:0 0 0 12px rgba(37,87,214,0)}}
.spk.lg{width:56px;height:56px}.spk.lg svg{width:26px;height:26px}
/* hero */
.hero{position:relative;overflow:hidden;border-radius:20px;padding:30px;color:#fff;background:linear-gradient(120deg,#1B3FA0 0%,#2557D6 45%,#7C4DFF 100%);box-shadow:var(--sh2)}
.hero h1{color:#fff;font-size:28px}.hero p{color:rgba(255,255,255,.85)}
.hero .blob{position:absolute;border-radius:50%;filter:blur(2px);opacity:.25;background:#fff;animation:drift 12s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(30px,-20px) scale(1.1)}}
.hero .cont{position:relative;z-index:1;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:14px;padding:16px 18px;margin-top:18px;display:flex;align-items:center;gap:16px;backdrop-filter:blur(6px)}
.hero .btn{background:#fff;color:var(--pri)}.hero .btn:hover{background:#EEF3FF}
/* roadmap */
.road{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;position:relative}
.wk{position:relative;padding:18px;border-radius:14px;background:#fff;border:1px solid var(--line);box-shadow:var(--sh)}
.wk.now{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-l),var(--sh)}
.wk .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--bg);color:var(--mut);margin-bottom:10px}
.wk.now .n{background:var(--pri);color:#fff}.wk.dn .n{background:var(--gr);color:#fff}
.wk li{font-size:14px;margin:4px 0;color:var(--ink2)}
.wk ul{padding-left:18px;margin:6px 0 10px}
/* topic cards (ELSA-like) */
.topics{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.tc{display:block;text-align:left;border-radius:16px;overflow:hidden;background:#fff;border:1px solid var(--line);box-shadow:var(--sh);width:100%;padding:0}
.tc .art{height:118px;position:relative;overflow:hidden}
.tc .art svg{position:absolute;inset:0;width:100%;height:100%}
.tc .art .e{position:absolute;right:14px;bottom:10px;font-size:46px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.2));transition:transform .3s}
.tc:hover .art .e{transform:scale(1.12) rotate(-6deg)}
.tc .b{padding:14px 16px 16px}
.tc h3{font-size:15.5px;margin:2px 0 4px;line-height:1.35}
/* course layout */
.cl{display:grid;grid-template-columns:300px 1fr;gap:0;max-width:1240px;margin:0 auto;min-height:calc(100vh - 64px)}
.side{position:sticky;top:64px;height:calc(100vh - 64px);overflow-y:auto;border-right:1px solid var(--line);background:#fff;padding:18px 0 40px}
.side .ct .tag{display:block}.side .ct{padding:0 18px 14px;border-bottom:1px solid var(--line);margin-bottom:8px}
.mod{border-bottom:1px solid #F0F2F6}
.mod>button{width:100%;text-align:left;padding:12px 18px;display:flex;gap:10px;align-items:flex-start;font-weight:700;font-size:14.5px}
.mod>button:hover{background:var(--bg)}
.mod .num{font-size:11.5px;font-weight:700;color:var(--mut);letter-spacing:.04em;text-transform:uppercase;display:block}
.mod .chev{transition:transform .2s;color:var(--mut);margin-top:3px}
.mod.open .chev{transform:rotate(90deg)}
.mod .items{display:none;padding-bottom:8px}
.mod.open .items{display:block;animation:enter .25s}
.it{display:flex;gap:10px;align-items:center;padding:8px 18px 8px 26px;font-size:14px;color:var(--ink2);border-left:3px solid transparent}
.it:hover{background:var(--bg);color:var(--ink)}
.it.on{background:var(--pri-l);color:var(--pri);border-left-color:var(--pri);font-weight:600}
.it .ck{width:20px;height:20px;border-radius:50%;border:2px solid #CBD2DF;display:grid;place-items:center;flex:none;color:#fff}
.it .ck.d{background:var(--gr);border-color:var(--gr);animation:pop .35s}
.it .ty{font-size:12px;color:var(--mut)}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.main{padding:32px 48px 100px;max-width:880px;width:100%;min-width:0;animation:enter .35s ease both}
.crumb{font-size:13.5px;color:var(--mut);margin-bottom:10px}
.crumb a{color:var(--mut)}.crumb a:hover{color:var(--pri)}
.meta{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--mut);margin-bottom:22px}
/* reading */
.read{font-size:17px;line-height:1.75}
.obj{background:var(--pri-l);border-radius:12px;padding:16px 20px;margin:0 0 8px}
.obj ul{margin:6px 0 0;padding-left:20px}
.pat{font-family:'Source Serif 4',Georgia,serif;font-size:27px;font-weight:600;color:var(--pri-d);background:#fff;border:1px solid var(--line);border-left:5px solid var(--pri);border-radius:12px;padding:18px 22px;margin:8px 0 16px;box-shadow:var(--sh)}
.ex{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}
.ex:last-child{border:0}
.en{font-family:'Source Serif 4',Georgia,serif;font-size:19px;font-weight:500;color:var(--ink)}
.vi{font-size:15px;color:var(--mut)}
.hidevi .vi{filter:blur(5px);transition:filter .2s;cursor:pointer}.hidevi .vi:hover{filter:none}
.mist{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.mist div{border-radius:12px;padding:12px 16px;font-size:16px}
.mist .w{background:var(--rd-l);color:#9B1C2B;text-decoration:line-through;text-decoration-color:rgba(220,53,69,.5)}
.mist .r{background:var(--gr-l);color:#0F6B33;font-weight:600}
.why{font-size:14.5px;color:var(--ink2);margin:-4px 0 18px;padding-left:4px}
table.voc{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--sh)}
table.voc th{text-align:left;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);background:var(--bg);padding:10px 14px;font-weight:700}
table.voc td{padding:12px 14px;border-top:1px solid var(--line);vertical-align:top;font-size:15px}
table.voc tr{transition:background .15s}table.voc tbody tr:hover{background:#FAFBFE}
table.voc td.w{font-weight:700;white-space:nowrap}
.done-bar{margin-top:40px;padding:20px;border-radius:14px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;gap:16px;box-shadow:var(--sh)}
.toc{position:fixed;right:max(20px,calc((100vw - 1240px)/2 + 20px));top:110px;width:200px;font-size:13.5px}
.toc a{display:block;padding:5px 12px;color:var(--mut);border-left:2px solid var(--line);transition:all .15s}
.toc a.on{color:var(--pri);border-left-color:var(--pri);font-weight:600}
/* exercises */
.ex-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:var(--sh);transition:border-color .2s}
.ex-card.ok{border-color:#9ED9B3}.ex-card.no{border-color:#F1AEB6}
.ex-card .q{font-weight:600;margin-bottom:12px}
.ex-card .num{font-size:12px;font-weight:700;color:var(--mut);letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px}
input[type=text],textarea{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);transition:border-color .15s,box-shadow .15s;resize:vertical}
input[type=text]:focus,textarea:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 4px var(--pri-l)}
.fbk{margin-top:12px;border-radius:10px;padding:12px 14px;font-size:15px;animation:enter .3s}
.fbk.ok{background:var(--gr-l);color:#0F5A2C}.fbk.no{background:var(--rd-l);color:#7E1621}.fbk.in{background:var(--bg);color:var(--ink2)}
.fbk b{color:var(--ink)}
.w-ok{color:var(--gr);font-weight:600}.w-no{color:var(--rd);font-weight:600;text-decoration:underline wavy;text-underline-offset:3px}
.tiles{display:flex;flex-wrap:wrap;gap:8px}
.tl{padding:7px 13px;border:1.5px solid var(--line);border-radius:9px;background:#fff;font-weight:600;font-size:15px;transition:transform .12s,border-color .12s;animation:pop .25s}
.tl:hover{border-color:var(--pri);transform:translateY(-2px)}
.tl.gone{visibility:hidden}
.al{min-height:52px;border:1.5px dashed #C9D1E0;border-radius:10px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;background:#FBFCFE}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.op{padding:9px 16px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-weight:600;font-size:15px;transition:all .15s;text-align:left}
.op:hover{border-color:var(--pri);background:var(--pri-l)}
.op.sel{border-color:var(--pri);background:var(--pri-l);color:var(--pri)}
.op.right{border-color:var(--gr);background:var(--gr-l);color:var(--gr)}
.op.wrong{border-color:var(--rd);background:var(--rd-l);color:var(--rd)}
.hints{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.hints span{font-size:13.5px;background:var(--am-l);color:#7A4E05;border-radius:7px;padding:3px 9px}
.frame{font-size:14.5px;background:var(--pri-l);color:var(--pri-d);border-radius:8px;padding:8px 12px;margin-bottom:10px}
.frame b{font-family:'Source Serif 4',Georgia,serif;font-size:16px}
.blank{display:inline-block;min-width:100px;border-bottom:2px solid var(--pri);margin:0 4px;text-align:center;color:var(--pri);font-weight:700}
.spin{width:16px;height:16px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite;display:inline-block}
.btn.out .spin,.btn.gh .spin{border-color:var(--pri-l);border-top-color:var(--pri)}
@keyframes rot{to{transform:rotate(360deg)}}
/* quiz */
.qres{text-align:center;padding:28px;border-radius:16px;margin-bottom:20px;animation:enter .4s}
.ringc{width:120px;height:120px;margin:0 auto 10px;position:relative}
.ringc svg{transform:rotate(-90deg)}
.ringc b{position:absolute;inset:0;display:grid;place-items:center;font-size:28px;font-weight:800}
/* flashcard */
.fcwrap{perspective:1200px;max-width:520px;margin:0 auto}
.fc{position:relative;height:300px;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,.9,.3,1);cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.fc .f{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px;text-align:center;box-shadow:var(--sh2)}
.fc .fr{background:linear-gradient(140deg,#2557D6,#7C4DFF);color:#fff}
.fc .bk{background:#fff;border:1px solid var(--line);transform:rotateY(180deg)}
.fc .fr .wd{font-size:38px;font-weight:800;letter-spacing:-.02em}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:520px;margin:18px auto 0}
.rate button{padding:12px;border-radius:12px;font-weight:700;border:1.5px solid var(--line);background:#fff;transition:transform .12s}
.rate button:hover{transform:translateY(-2px)}
.rate .a{color:var(--rd);border-color:#F1AEB6}.rate .b{color:var(--am);border-color:#F2D193}.rate .c{color:var(--gr);border-color:#9ED9B3}
/* speaking */
.mic{width:84px;height:84px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;margin:0 auto;box-shadow:0 8px 24px rgba(37,87,214,.35);transition:transform .15s}
.mic:hover{transform:scale(1.05)}
.mic.on{background:var(--rd);animation:ring2 1.2s ease-out infinite}
@keyframes ring2{0%{box-shadow:0 0 0 0 rgba(220,53,69,.45)}100%{box-shadow:0 0 0 22px rgba(220,53,69,0)}}
.wave{display:flex;gap:4px;justify-content:center;height:28px;align-items:center;margin-top:12px}
.wave i{width:4px;border-radius:4px;background:var(--rd);animation:wv .9s ease-in-out infinite}
@keyframes wv{0%,100%{height:6px}50%{height:26px}}
.sw{font-family:'Source Serif 4',Georgia,serif;font-size:26px;line-height:1.6;text-align:center}
.sw span{padding:0 2px;border-radius:5px;transition:all .3s}
.sw .g{color:var(--gr);background:var(--gr-l)}.sw .r{color:var(--rd);background:var(--rd-l)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:12px;font-size:14.5px;font-weight:600;z-index:90;animation:enter .3s;box-shadow:var(--sh2);max-width:92vw;text-align:center}
canvas#cf{position:fixed;inset:0;pointer-events:none;z-index:80}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat3 .card{padding:16px;text-align:center}.stat3 b{font-size:26px;display:block;letter-spacing:-.02em}
.drawer-bg{display:none}
/* quotes */
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.qcard{position:relative;background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px 24px 20px;box-shadow:var(--sh);border-top:4px solid var(--qc);transition:box-shadow .2s;overflow:hidden}
.qcard:hover{box-shadow:var(--sh2)}
.qmark{position:absolute;right:18px;top:-14px;font-family:'Source Serif 4',Georgia,serif;font-size:120px;line-height:1;color:var(--qc);opacity:.12;pointer-events:none}
.qtext{margin:0 0 14px;font-family:'Source Serif 4',Georgia,serif;font-size:23px;line-height:1.45;font-weight:500;color:var(--ink)}
.qby{font-size:14px;color:var(--ink2);margin-bottom:12px}
.qfav{font-size:22px;color:#C9CFDA;width:34px;height:34px;border-radius:50%;transition:transform .2s,color .2s}.qfav:hover{transform:scale(1.15)}.qfav.on{color:#F5A524}
.qvi{font-size:15px;color:var(--ink2);font-style:italic;margin-bottom:10px}
.qnote{font-size:14.5px;background:var(--bg);border-radius:10px;padding:10px 12px;margin-bottom:14px;color:var(--ink2)}
.qtask{border-top:1px dashed var(--line);padding-top:14px}
.myq{border-top:1px solid var(--line);margin-top:14px;padding-top:14px;animation:enter .3s}
.save{font-size:12.5px;font-weight:700;color:var(--am);background:var(--am-l);border-radius:7px;padding:2px 8px;margin-left:4px}
/* chat */
.scgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:22px}
.scard{text-align:left;background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--sh)}
.chatwrap{display:grid;grid-template-columns:280px 1fr;max-width:1240px;margin:0 auto;height:calc(100vh - 64px)}
.chside{border-right:1px solid var(--line);background:#fff;overflow-y:auto;padding:14px 10px}
.scn{width:100%;display:flex;gap:10px;align-items:center;text-align:left;padding:10px 12px;border-radius:12px;margin-bottom:4px;transition:background .15s}
.scn:hover{background:var(--bg)}.scn.on{background:var(--pri-l)}
.scn b{display:block;font-size:14.5px}.scemo{font-size:24px}
.chmain{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.chhead{display:flex;align-items:center;gap:12px;padding:12px 20px;background:#fff;border-bottom:1px solid var(--line)}
.goals{display:flex;flex-wrap:wrap;gap:6px;padding:10px 20px;background:#fff;border-bottom:1px solid var(--line)}
.goal{font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--bg);color:var(--mut);transition:all .3s}
.goal.on{background:var(--gr-l);color:var(--gr);animation:pop .4s}
.msgs{flex:1;overflow-y:auto;padding:22px 20px;scroll-behavior:smooth}
.msg{display:flex;flex-direction:column;margin-bottom:14px;max-width:78%;animation:enter .3s}
.msg.ai{flex-direction:row;align-items:flex-end;gap:8px}
.msg.me{margin-left:auto;align-items:flex-end}
.bub{padding:12px 16px;border-radius:18px;font-size:16px;line-height:1.5}
.ai .bub{background:#fff;border:1px solid var(--line);border-bottom-left-radius:6px}
.me .bub{background:var(--pri);color:#fff;border-bottom-right-radius:6px}

.fixc.ok{background:var(--gr-l);color:#0F5A2C}.fixc.no{background:var(--am-l);color:#6B4504}.fixc.in{background:#fff;color:var(--mut)}
.dots3{display:inline-flex;gap:4px}.dots3 i{width:7px;height:7px;border-radius:50%;background:#A6AFC2;animation:bl 1.2s infinite}.dots3 i:nth-child(2){animation-delay:.2s}.dots3 i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.chin{display:flex;gap:10px;padding:12px 20px 16px;background:#fff;border-top:1px solid var(--line)}
.chin .col{display:flex;flex-direction:column;gap:6px}.chin .btn{white-space:nowrap}
.hintbox{margin:0 20px 10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;animation:enter .3s;box-shadow:var(--sh)}
.hint{display:block;width:100%;text-align:left;padding:8px 12px;border-radius:10px;margin-top:6px;background:var(--pri-l);color:var(--pri-d);font-weight:600;font-size:14.5px;transition:background .15s}.hint:hover{background:#DAE5FC}
.endc{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--sh);animation:enter .4s;margin-top:10px}
.band{text-align:center;background:linear-gradient(135deg,#2557D6,#7C4DFF);color:#fff;border-radius:14px;padding:12px 18px}.band small{display:block;font-size:11px;opacity:.85}.band b{font-size:30px}
.grid2c{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}.grid2c ul{padding-left:18px;margin:4px 0}

@media (max-width:860px){
 h1{font-size:25px}.grid2{grid-template-columns:1fr}.cl{grid-template-columns:1fr}

 .side.open{transform:none}.drawer-bg.open{display:block;position:fixed;inset:0;background:rgba(22,33,58,.35);z-index:55}
 .main{padding:22px 18px 90px}.nav{display:none}.btn.mb{display:inline-flex}.mist{grid-template-columns:1fr}
 .bn{position:fixed;left:0;right:0;bottom:0;z-index:45;background:#fff;border-top:1px solid var(--line);display:flex}
 .bn a{flex:1;text-align:center;font-size:11.5px;font-weight:600;color:var(--mut);padding:8px 0 10px}.bn a.on{color:var(--pri)}
 .bn svg{display:block;margin:0 auto 2px}
 body{padding-bottom:58px}
 .hero{padding:22px}.read{font-size:16.5px}.pat{font-size:22px}
}
@media (min-width:861px){.bn{display:none}}

code{background:var(--bg);padding:1px 6px;border-radius:5px;font-size:.92em}

<script>(function(){var H="be79ec3efae9fcd4cf3d134d0adbd5147b36eea241d4ac9885f4f46f36e6f326",g=document.getElementById('gate');function sha(t){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)).then(function(b){return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')})}

<script>
const L=(id,title,p,vi,ex,words,s,obj,mist)=>({id,title,st:{p,vi,ex},words,s,obj,mist});
const COURSE=[
{id:'u1',name:'Giới thiệu bản thân chuyên nghiệp',goal:'Giới thiệu kinh nghiệm và thế mạnh như một ứng viên B2+',color:'#7C5CFF',dark:'#5B3FE0',emo:'👋',lessons:[
L('u1l1','Kinh nghiệm của tôi',"I've been ___-ing for ___ / since ___.","<b>Hiện tại hoàn thành tiếp diễn</b> cho việc bắt đầu trong quá khứ và vẫn đang tiếp tục. <b>for</b> + khoảng thời gian, <b>since</b> + mốc thời gian. Người Việt hay dùng nhầm hiện tại đơn ở chỗ này.",
 [["I've been working in content production since 2023.","Mình làm sản xuất nội dung từ năm 2023."],["I've been managing YouTube channels for almost a year.","Mình quản lý kênh YouTube được gần một năm."]],
 [["hands-on experience","kinh nghiệm thực tế","I have hands-on experience in channel management."],["specialise in","chuyên về","I specialise in long-form storytelling."],["track record","thành tích đã được chứng minh","She has a strong track record of growing channels."],["versatile","đa năng","I'm a versatile creator who can write, edit and design."],["background in","nền tảng về","I have a background in e-commerce and digital marketing."]],
 [["I've been working in content production since 2023.","Mình làm trong mảng sản xuất nội dung từ năm 2023."],["I specialise in long-form storytelling for YouTube.","Mình chuyên về kể chuyện dạng dài cho YouTube."],["I have hands-on experience in scripting, editing and SEO.","Mình có kinh nghiệm thực tế về viết kịch bản, dựng video và SEO."],["My background in marketing helps me understand what audiences want.","Nền tảng marketing giúp mình hiểu khán giả muốn gì."]],
 ['Nói về kinh nghiệm kéo dài đến hiện tại','Dùng collocation chuyên nghiệp thay cho từ đơn giản'],
 [["I work here since 2023.","I've been working here since 2023.","Việc bắt đầu trong quá khứ và còn tiếp diễn: dùng hiện tại hoàn thành (tiếp diễn), không dùng hiện tại đơn."],["I have many experiences in writing.","I have a lot of experience in writing.","experience (kinh nghiệm) là danh từ không đếm được; experiences là “những trải nghiệm”."]]),
L('u1l2','Điều làm tôi khác biệt',"What sets me apart is (that) ___.","<b>Câu chẻ (cleft sentence)</b> với <b>What … is …</b> để nhấn mạnh điểm mạnh nhất. Nghe tự tin và chuyên nghiệp hơn hẳn “I am good at…”, và là cấu trúc giúp tăng điểm Grammatical Range.",
 [["What sets me apart is that I combine research with storytelling.","Điểm khác biệt của mình là kết hợp nghiên cứu với kể chuyện."],["What I enjoy most is turning complex topics into simple stories.","Điều mình thích nhất là biến chủ đề phức tạp thành câu chuyện đơn giản."]],
 [["what sets me apart","điều làm mình khác biệt","What sets me apart is my attention to detail."],["attention to detail","sự tỉ mỉ","Fact-checking requires attention to detail."],["data-driven","dựa trên dữ liệu","I take a data-driven approach to content."],["bring to the table","đóng góp, mang lại (cho team)","Let me explain what I can bring to the table."],["self-motivated","tự giác, chủ động","Remote work suits self-motivated people."]],
 [["What sets me apart is that I combine research with storytelling.","Điểm khác biệt của mình là kết hợp nghiên cứu với kể chuyện."],["I take a data-driven approach, so every decision is based on analytics.","Mình làm việc dựa trên dữ liệu, nên mọi quyết định đều dựa vào số liệu."],["As a self-motivated person, I work well without close supervision.","Là người tự giác, mình làm tốt mà không cần giám sát sát sao."],["What I can bring to the table is a clear, repeatable workflow.","Điều mình có thể đóng góp là một quy trình rõ ràng, lặp lại được."]],
 ['Nhấn mạnh thế mạnh bằng câu chẻ What … is …','Mô tả phong cách làm việc bằng tính từ ghép'],
 [["What make me different is my research.","What makes me different is my research.","Mệnh đề What… làm chủ ngữ số ít, động từ thêm -s."],["I am very detail.","I pay close attention to detail.","detail là danh từ; dùng collocation pay attention to detail hoặc tính từ detail-oriented."]])]},
{id:'u2',name:'Quy trình làm việc',goal:'Mô tả quy trình bằng câu bị động và mệnh đề phân từ',color:'#14B8A6',dark:'#0E8C7F',emo:'⚙️',lessons:[
L('u2l1','Mô tả quy trình',"___ is/are ___-ed before / once ___.","<b>Câu bị động</b> dùng khi điều quan trọng là việc được làm, không phải ai làm. Đây là cách viết chuẩn của tài liệu quy trình (SOP) và của bài <b>IELTS Task 1 dạng process</b>. Nối các bước bằng <b>before, after, once</b>.",
 [["Each script is fact-checked before it is sent to the editor.","Mỗi kịch bản được kiểm tra thông tin trước khi gửi cho editor."],["Thumbnails are designed once the title has been approved.","Thumbnail được thiết kế sau khi tiêu đề đã được duyệt."]],
 [["approve","phê duyệt","The title must be approved by the client."],["draft","bản nháp; soạn thảo","The first draft is written in Google Docs."],["handed over","được bàn giao","The files are handed over to the editor."],["once","ngay khi, một khi","Once the script is approved, recording begins."],["streamline","tinh gọn (quy trình)","We streamline the process with templates."]],
 [["Each script is fact-checked before it is sent to the editor.","Mỗi kịch bản được kiểm tra thông tin trước khi gửi cho editor."],["Once the outline is approved, the full draft is written.","Khi dàn ý được duyệt, bản nháp đầy đủ sẽ được viết."],["The final files are handed over to the editor every Friday.","File cuối được bàn giao cho editor vào mỗi thứ Sáu."],["The process has been streamlined to save time.","Quy trình đã được tinh gọn để tiết kiệm thời gian."]],
 ['Mô tả các bước bằng câu bị động','Nối các bước bằng once, before, after'],
 [["The script is check before publishing.","The script is checked before publishing.","Bị động = be + V3 (checked), không dùng động từ nguyên mẫu."],["The video was uploaded by me.","I uploaded the video.","Chỉ dùng bị động khi người làm không quan trọng; nói về việc của chính mình thì câu chủ động tự nhiên hơn."]]),
L('u2l2','Rút gọn câu bằng phân từ',"Having ___-ed ___, I ___.","<b>Mệnh đề phân từ</b> giúp gộp hai câu thành một, gọn và mạch lạc. <b>Having + V3</b> = sau khi đã làm xong. <b>V-ing</b> đầu câu = bằng cách/trong khi. Quy tắc vàng: <b>chủ ngữ hai vế phải là một</b>.",
 [["Having analysed the comments, I adjusted the next script.","Sau khi phân tích bình luận, mình điều chỉnh kịch bản tiếp theo."],["After reviewing the analytics, we decided to shorten the intro.","Sau khi xem số liệu, bọn mình quyết định rút ngắn phần mở đầu."]],
 [["analyse","phân tích","Having analysed the data, I found a pattern."],["adjust","điều chỉnh","I adjust the pacing after each test."],["insight","góc nhìn rút ra","The comments gave us a valuable insight."],["prioritise","ưu tiên","We prioritise topics with proven demand."],["identify","xác định","Data helps us identify the real problem."]],
 [["Having analysed the comments, I adjusted the next script.","Sau khi phân tích bình luận, mình đã điều chỉnh kịch bản tiếp theo."],["After reviewing the analytics, we decided to shorten the intro.","Sau khi xem số liệu, bọn mình quyết định rút ngắn phần mở đầu."],["Using AI tools, I can research a topic in half the time.","Nhờ dùng công cụ AI, mình nghiên cứu một chủ đề chỉ mất nửa thời gian."],["Having identified the problem, we prioritised a new thumbnail.","Sau khi xác định được vấn đề, bọn mình ưu tiên làm thumbnail mới."]],
 ['Gộp hai câu bằng Having + V3','Dùng V-ing đầu câu để nói cách làm'],
 [["Having analyse the data, I…","Having analysed the data, I…","Sau Having phải là V3."],["After reviewing the data, the problem was clear.","After reviewing the data, I realised what the problem was.","Người review là “I”, nên chủ ngữ vế sau phải là I (lỗi dangling participle)."]])]},
{id:'u3',name:'Số liệu & xu hướng',goal:'Mô tả xu hướng như IELTS Task 1 và giải thích nguyên nhân',color:'#3B82F6',dark:'#2563C9',emo:'📈',lessons:[
L('u3l1','Mô tả xu hướng',"___ rose/fell sharply from ___ to ___. / There was a steady ___ in ___.","Hai cách mô tả xu hướng: <b>động từ + trạng từ</b> (rose sharply) hoặc <b>There was + tính từ + danh từ</b> (a sharp rise). Đây chính là ngôn ngữ của <b>IELTS Writing Task 1</b>, dùng được ngay khi báo cáo số liệu kênh.",
 [["Watch time rose sharply from 2,000 to 6,500 hours.","Thời gian xem tăng mạnh từ 2.000 lên 6.500 giờ."],["There was a steady decline in click-through rate over the month.","Tỷ lệ nhấp giảm đều trong suốt tháng."]],
 [["sharply","mạnh, đột ngột","Views rose sharply after the upload."],["steady","đều đặn","There was a steady increase in subscribers."],["peak","đạt đỉnh","Views peaked at 40,000 on Sunday."],["fluctuate","dao động","Daily views fluctuated between 1,000 and 3,000."],["decline","sự sụt giảm; giảm","There was a slight decline in retention."]],
 [["Watch time rose sharply from 2,000 to 6,500 hours.","Thời gian xem tăng mạnh từ 2.000 lên 6.500 giờ."],["Views peaked at 40,000 on the day of the upload.","Lượt xem đạt đỉnh 40.000 vào ngày đăng."],["Daily views fluctuated slightly during the first week.","Lượt xem mỗi ngày dao động nhẹ trong tuần đầu."],["There was a steady increase in subscribers over three months.","Số người đăng ký tăng đều trong ba tháng."]],
 ['Mô tả tăng giảm kèm mức độ','Dùng cả dạng động từ và dạng danh từ'],
 [["Views increased sharp.","Views increased sharply.","Bổ nghĩa cho động từ phải dùng trạng từ (-ly)."],["There was a sharp increase of views.","There was a sharp increase in views.","increase/decrease in + thứ thay đổi; increase of + mức thay đổi (an increase of 20%)."]]),
L('u3l2','Nguyên nhân và hệ quả',"___ was largely due to ___, which led to ___.","<b>due to + danh từ</b> (không đi với mệnh đề). <b>which led to / resulting in</b> để nối hệ quả. Thêm <b>largely, mainly, partly</b> để nói mức độ chính xác hơn, nghe khách quan.",
 [["The drop in views was largely due to an unclear title.","Lượt xem giảm chủ yếu do tiêu đề không rõ ràng."],["We changed the hook, which led to a 15% rise in retention.","Bọn mình đổi đoạn mở đầu, dẫn đến tỷ lệ giữ chân tăng 15%."]],
 [["due to","do, bởi vì","The delay was due to a technical issue."],["lead to","dẫn đến","A weak hook can lead to low retention."],["result in","đưa đến kết quả","A clearer format can result in more shares."],["contribute to","góp phần vào","Many factors contribute to growth."],["underperform","hoạt động kém kỳ vọng","The video underperformed in its first week."]],
 [["The drop in views was largely due to an unclear title.","Lượt xem giảm chủ yếu là do tiêu đề không rõ ràng."],["We changed the hook, which led to a 15% rise in retention.","Bọn mình đổi đoạn mở đầu, điều này dẫn đến tỷ lệ giữ chân tăng 15%."],["Several factors contributed to the channel's growth.","Nhiều yếu tố đã góp phần vào sự tăng trưởng của kênh."],["The video underperformed because it was published at the wrong time.","Video hoạt động kém vì được đăng sai thời điểm."]],
 ['Giải thích nguyên nhân bằng due to','Nối hệ quả bằng which led to / resulted in'],
 [["Views dropped due to the title was unclear.","Views dropped because the title was unclear. (hoặc: due to the unclear title)","due to + danh từ; because + mệnh đề."],["It led to increase retention.","It led to an increase in retention.","lead to + danh từ hoặc V-ing, không + động từ nguyên mẫu."]])]},
{id:'u4',name:'Kể chuyện & kịch bản',goal:'Viết lời dẫn có kịch tính bằng thì kể chuyện và đảo ngữ',color:'#F97316',dark:'#D35A0B',emo:'🎬',lessons:[
L('u4l1','Thì kể chuyện',"By the time ___ (V2), ___ had ___ (V3).","<b>Quá khứ hoàn thành</b> (had + V3) cho việc xảy ra trước một mốc quá khứ khác. Rất hay dùng trong kịch bản lịch sử để tạo lớp thời gian và kịch tính.",
 [["By the time the rescue team arrived, the pilot had already disappeared.","Khi đội cứu hộ đến nơi, phi công đã biến mất."],["She had never flown at night before that mission.","Trước nhiệm vụ đó cô ấy chưa từng bay đêm."]],
 [["by the time","vào lúc mà","By the time we published, the trend had faded."],["unfold","diễn ra, hé lộ dần","The story unfolds over three days."],["turning point","bước ngoặt","That decision was the turning point of the war."],["foreshadow","báo trước, gài cảnh","The first scene foreshadows the ending."],["vivid","sống động","Use vivid details to keep viewers engaged."]],
 [["By the time the rescue team arrived, the pilot had already disappeared.","Khi đội cứu hộ đến nơi, phi công đã biến mất."],["The story unfolds over three days in 1944.","Câu chuyện diễn ra trong ba ngày năm 1944."],["That single decision became the turning point of the battle.","Quyết định duy nhất đó trở thành bước ngoặt của trận đánh."],["The opening scene foreshadows what happens at the end.","Cảnh mở đầu báo trước điều xảy ra ở cuối."]],
 ['Sắp xếp sự kiện bằng quá khứ hoàn thành','Dùng từ vựng kể chuyện chuyên nghiệp'],
 [["When he arrived, the plane already left.","When he arrived, the plane had already left.","Việc xảy ra trước một mốc quá khứ: had + V3."],["The story is happened in 1944.","The story happened in 1944. (hoặc: takes place in 1944)","happen là nội động từ, không có dạng bị động."]]),
L('u4l2','Nhấn mạnh bằng đảo ngữ',"Not only did ___, but ___ also ___. / Never before had ___.","<b>Đảo ngữ</b>: đưa trợ động từ lên trước chủ ngữ sau Not only, Never, Rarely. Tạo kịch tính cho lời dẫn và là “vũ khí” của bài viết band 7.",
 [["Not only did the plan fail, but it also cost three lives.","Kế hoạch không chỉ thất bại mà còn cướp đi ba mạng người."],["Never before had a pilot survived such a crash.","Chưa từng có phi công nào sống sót sau một vụ rơi như vậy."]],
 [["not only","không chỉ","Not only is the story true, but it is also little known."],["rarely","hiếm khi","Rarely do viewers comment on old videos."],["remarkable","phi thường, đáng chú ý","It was a remarkable escape."],["suspense","sự hồi hộp","Good narration builds suspense."],["cliffhanger","đoạn kết lửng gây tò mò","Each part ends with a cliffhanger."]],
 [["Not only did the plan fail, but it also cost three lives.","Kế hoạch không chỉ thất bại mà còn cướp đi ba mạng người."],["Never before had a pilot survived such a crash.","Chưa từng có phi công nào sống sót sau một vụ rơi như vậy."],["Rarely do viewers stay until the end of a long video.","Hiếm khi người xem ở lại đến cuối một video dài."],["Each section ends with a cliffhanger to build suspense.","Mỗi phần kết thúc bằng một đoạn lửng để tạo hồi hộp."]],

{id:'u5',name:'Đề xuất & thử nghiệm',goal:'So sánh lựa chọn và đưa ra nhận định thận trọng',color:'#EC4899',dark:'#C42C77',emo:'🧪',lessons:[
L('u5l1','So sánh nâng cao',"___ is far / considerably more ___ than ___. / The more ___, the more ___.","Nhấn mạnh mức chênh lệch bằng <b>far, much, considerably, slightly</b>. Cấu trúc <b>The more…, the more…</b> (càng… càng…) cho hai thứ thay đổi cùng nhau.",
 [["The new thumbnail is far more eye-catching than the old one.","Thumbnail mới bắt mắt hơn hẳn cái cũ."],["The more specific the title is, the more clicks it gets.","Tiêu đề càng cụ thể thì càng nhiều lượt nhấp."]],
 [["eye-catching","bắt mắt","The thumbnail needs to be eye-catching on mobile."],["considerably","đáng kể","Retention improved considerably."],["clutter","sự rối mắt","Too much text creates clutter."],["outperform","hiệu quả hơn, vượt","Version B outperformed version A."],["legible","dễ đọc (chữ)","The text must be legible on small screens."]],
 [["The new thumbnail is far more eye-catching than the old one.","Thumbnail mới bắt mắt hơn hẳn cái cũ."],["The more specific the title is, the more clicks it gets.","Tiêu đề càng cụ thể thì càng có nhiều lượt nhấp."],["Version B outperformed version A by a considerable margin.","Phiên bản B hiệu quả hơn phiên bản A với cách biệt đáng kể."],["Less clutter makes the text more legible on mobile.","Bớt rối mắt giúp chữ dễ đọc hơn trên điện thoại."]],
 ['Nhấn mạnh mức độ khi so sánh','Dùng cấu trúc càng… càng…'],

L('u5l2','Nhận định thận trọng',"It seems likely that ___. / This might suggest that ___.","<b>Hedging</b>: không khẳng định 100% khi dữ liệu chưa đủ. Người bản xứ và giám khảo IELTS đánh giá cao vì nghe khách quan, chuyên nghiệp. Từ khóa: <b>seem, tend to, may/might, to some extent</b>.",
 [["It seems likely that the topic, not the thumbnail, caused the drop.","Có vẻ nguyên nhân sụt giảm là chủ đề chứ không phải thumbnail."],["This might suggest that our audience prefers shorter videos.","Điều này có thể cho thấy khán giả thích video ngắn hơn."]],
 [["it seems likely","có vẻ như","It seems likely that the trend will continue."],["suggest","cho thấy (nhận định)","The data suggests a change in behaviour."],["tend to","có xu hướng","Viewers tend to leave after two minutes."],["to some extent","ở một mức độ nào đó","The title helped to some extent."],["inconclusive","chưa đủ để kết luận","The test results were inconclusive."]],
 [["It seems likely that the topic, not the thumbnail, caused the drop.","Có vẻ nguyên nhân sụt giảm là chủ đề chứ không phải thumbnail."],["Viewers tend to leave when the intro is longer than thirty seconds.","Người xem có xu hướng rời đi khi phần mở đầu dài hơn ba mươi giây."],["The results are inconclusive, so we need another test.","Kết quả chưa đủ để kết luận nên cần thử thêm."],["To some extent, the new format improved engagement.","Ở một mức độ nào đó, định dạng mới đã cải thiện tương tác."]],
 ['Đưa nhận định mà không khẳng định quá mức','Nói về kết quả thử nghiệm'],
 [["This proves that viewers hate long videos.","This suggests that viewers may prefer shorter videos.","Một video không đủ để chứng minh; dùng suggest/may để khách quan."],["Viewers are tend to leave.","Viewers tend to leave.","tend là động từ, không đi với be."]])]},
{id:'u6',name:'Làm việc với khách',goal:'Yêu cầu, từ chối và phản biện một cách ngoại giao',color:'#10B981',dark:'#0B8F63',emo:'🤝',lessons:[
L('u6l1','Ngôn ngữ ngoại giao',"I was wondering if you could ___. / Would it be possible to ___?","Dùng <b>thì quá khứ</b> (was wondering) làm lời đề nghị mềm hơn nhiều so với Can you. Hợp với khách mới hoặc khi yêu cầu điều khó.",

 [["I was wondering","không biết là (mở lời lịch sự)","I was wondering if we could have a quick call."],["extend","gia hạn","Could we extend the deadline?"],["clarify","làm rõ","Could you clarify the target audience?"],["scope","phạm vi công việc","This task is outside the original scope."],["at your earliest convenience","khi nào bạn tiện sớm nhất","Please reply at your earliest convenience."]],
 [["I was wondering if you could share some reference videos.","Không biết bạn có thể gửi vài video tham khảo không."],["Would it be possible to extend the deadline to Monday?","Liệu có thể lùi hạn chót sang thứ Hai không?"],["Could you clarify the scope of the project?","Bạn có thể làm rõ phạm vi dự án không?"],["Please send the brief at your earliest convenience.","Bạn gửi giúp mình bản mô tả khi nào tiện sớm nhất nhé."]],

L('u6l2','Phản biện lịch sự',"I see your point, but ___. That said, ___.","Công nhận ý người kia trước rồi mới đưa ý khác. <b>That said</b> = tuy vậy. Giúp bất đồng mà không mất lòng khách.",
 [["I see your point, but a shorter title might work better on mobile.","Mình hiểu ý bạn, nhưng tiêu đề ngắn hơn có thể hiệu quả hơn trên điện thoại."],["That said, I'm happy to test both versions.","Tuy vậy, mình sẵn sàng thử cả hai phiên bản."]],
 [["I see your point","mình hiểu ý bạn","I see your point, but the data says otherwise."],["that said","tuy vậy","That said, your idea is worth testing."],["alternatively","hoặc là (phương án khác)","Alternatively, we could split the video into two parts."],["compromise","sự thỏa hiệp","Let's find a compromise."],["concern","mối lo ngại","My main concern is the length."]],
 [["I see your point, but a shorter title might work better on mobile.","Mình hiểu ý bạn, nhưng tiêu đề ngắn hơn có thể hiệu quả hơn trên điện thoại."],["My main concern is that the video feels too long.","Mối lo chính của mình là video có vẻ quá dài."],["Alternatively, we could split it into two episodes.","Hoặc là mình có thể chia thành hai tập."],["That said, I'm happy to try your version first.","Tuy vậy, mình sẵn sàng thử phiên bản của bạn trước."]],
 ['Bất đồng mà vẫn giữ quan hệ','Đưa phương án thay thế'],
 [["You are wrong, the title is too long.","I see your point, but the title might be a bit long.","Nói thẳng “you are wrong” rất nặng với khách; hãy công nhận rồi đề xuất."],["I'm concern about the length.","I'm concerned about the length. (hoặc: My concern is the length.)","Tính từ là concerned; concern là danh từ."]])]},
{id:'u7',name:'Tiến độ & xử lý sự cố',goal:'Hứa thời hạn chính xác và rút kinh nghiệm bằng câu điều kiện',color:'#6366F1',dark:'#4447D4',emo:'⏱️',lessons:[

 [["By Friday, I will have finished the first two scripts.","Đến thứ Sáu, mình sẽ hoàn thành hai kịch bản đầu tiên."],["I'll be working on the thumbnails tomorrow morning.","Sáng mai mình sẽ làm thumbnail."],["We are slightly ahead of schedule this week.","Tuần này bọn mình đang sớm hơn tiến độ một chút."],["I'll keep you posted if anything changes.","Mình sẽ cập nhật cho bạn nếu có gì thay đổi."]],

L('u7l2','Câu điều kiện xử lý sự cố',"If we had ___, we would have ___. / Should you need ___, ___.","<b>Điều kiện loại 3</b> để rút kinh nghiệm từ quá khứ mà không đổ lỗi. <b>Should you need…</b> là đảo ngữ trang trọng của If you need…, rất hay dùng trong email.",

{id:'u8',name:'Phỏng vấn',goal:'Trả lời phỏng vấn mạch lạc theo STAR và nói về mục tiêu',color:'#F59E0B',dark:'#C97C05',emo:'🏆',lessons:[
L('u8l1','Kể thành tích theo STAR',"Initially, ___. Subsequently, ___. Ultimately, ___.","Từ nối trang trọng hơn first/then/finally. <b>STAR</b> = Situation (bối cảnh), Task (nhiệm vụ), Action (hành động), Result (kết quả). Luôn kết bằng con số hoặc kết quả cụ thể.",
 [["Initially, the channel was getting fewer than 100 views per video.","Ban đầu, kênh chỉ có dưới 100 lượt xem mỗi video."],["Ultimately, our watch time tripled within two months.","Cuối cùng, thời gian xem tăng gấp ba trong hai tháng."]],
 [["initially","ban đầu","Initially, I was responsible only for scripts."],["subsequently","sau đó","Subsequently, I took over the whole channel."],["ultimately","cuối cùng, rốt cuộc","Ultimately, the series became our most popular."],["take ownership of","chủ động chịu trách nhiệm về","I'm ready to take ownership of the channel."],["measurable","đo lường được","I always set measurable goals."]],
 [["Initially, the channel was getting fewer than 100 views per video.","Ban đầu, kênh chỉ có dưới 100 lượt xem mỗi video."],["Subsequently, I took ownership of the research and scripting process.","Sau đó, mình chủ động phụ trách quy trình nghiên cứu và viết kịch bản."],["Ultimately, our watch time tripled within two months.","Cuối cùng, thời gian xem tăng gấp ba trong vòng hai tháng."],["I always set measurable goals for each video.","Mình luôn đặt mục tiêu đo lường được cho mỗi video."]],
 ['Kể thành tích theo trình tự STAR','Dùng từ nối trang trọng'],
 [["At the end, the views increased.","In the end, the views increased. (hoặc: Ultimately, …)","at the end (of sth) = ở cuối; in the end = cuối cùng thì."],["I took the ownership of it.","I took ownership of it.","Cụm cố định, không có the."]]),
L('u8l2','Điểm yếu & mục tiêu',"One area I'm working on is ___. In the long run, I aim to ___.","Nói điểm yếu như một việc <b>đang cải thiện</b> (kèm việc cụ thể đang làm). <b>In the long run + aim to</b> để nói mục tiêu dài hạn, thể hiện tầm nhìn.",

{id:'q7',u:'u4',q:"Begin at the beginning, and go on till you come to the end: then stop.",by:"Lewis Carroll",src:"Alice's Adventures in Wonderland",yr:"1865",vi:"Bắt đầu từ đầu, kể tiếp cho đến khi tới cuối, rồi dừng lại.",note:"Câu mệnh lệnh nối tiếp tạo nhịp. <b>go on</b> = tiếp tục; <b>till</b> = until. Lời khuyên kể chuyện tuyến tính, cực hợp cho kịch bản.",task:"Viết 2–3 câu mệnh lệnh ngắn hướng dẫn một người mới viết kịch bản."},
{id:'q8',u:'u4',q:"It was the best of times, it was the worst of times.",by:"Charles Dickens",src:"A Tale of Two Cities",yr:"1859",vi:"Đó là thời tươi đẹp nhất, cũng là thời tồi tệ nhất.",note:"<b>Song hành (parallelism)</b>: hai vế cùng cấu trúc, ý đối lập. Một trong những câu mở đầu nổi tiếng nhất. Kỹ thuật vàng cho hook kịch bản.",task:"Viết câu mở đầu kịch bản theo kiểu song hành cho một chủ đề lịch sử bạn thích."},

{id:'q10',u:'u5',q:"Brevity is the soul of wit.",by:"William Shakespeare",src:"Hamlet",yr:"c. 1600",vi:"Ngắn gọn là linh hồn của sự dí dỏm.",note:"<b>brevity</b> (n) = sự ngắn gọn. <b>the soul of</b> = cốt lõi của. Dùng để nói về tiêu đề và thumbnail: càng gọn càng mạnh.",task:"Dùng “brevity” hoặc “concise” viết 1 câu về tiêu đề video."},
{id:'q11',u:'u6',q:"Take nothing on its looks; take everything on evidence.",by:"Charles Dickens",src:"Great Expectations",yr:"1861",vi:"Đừng tin điều gì qua vẻ bề ngoài; hãy tin dựa trên bằng chứng.",note:"<b>on evidence</b> = dựa vào bằng chứng. Cấu trúc đối lập <b>nothing… / everything…</b> giúp lập luận chặt khi thuyết phục khách.",task:"Viết 1–2 câu thuyết phục khách đừng đổi tiêu đề chỉ vì cảm giác, hãy dựa vào số liệu."},

{id:'q13',u:'u7',q:"Lost time is never found again.",by:"Benjamin Franklin",src:"Poor Richard's Almanack",yr:"1748",vi:"Thời gian đã mất thì không bao giờ tìm lại được.",note:"Câu <b>bị động</b> với never: <b>is never found</b>. Ngắn gọn, phù hợp để nói về deadline và tiến độ.",task:"Viết 1 câu bị động về tiến độ dự án (ví dụ: “The files will be…”)."},
{id:'q14',u:'u7',q:"It takes all the running you can do, to keep in the same place.",by:"Lewis Carroll",src:"Through the Looking-Glass",yr:"1871",vi:"Phải chạy hết sức chỉ để giữ nguyên chỗ cũ.",note:"<b>It takes + N + to V</b> = cần… để…. Mô tả rất đúng cuộc đua với thuật toán YouTube.",task:"Viết 1 câu theo mẫu “It takes ___ to ___.” về việc giữ kênh tăng trưởng."},

function diffWords(ref,att){const toks=ref.split(/\s+/).filter(Boolean);const f=t=>t.toLowerCase().replace(/[’]/g,"'").replace(/[^a-z0-9'-]/g,'');
 const a=toks.map(f),b=att.split(/\s+/).map(f).filter(Boolean),n=a.length,m=b.length;const dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
 for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
 const ok=new Array(n).fill(false);let i=0,j=0;while(i<n&&j<m){if(a[i]===b[j]){ok[i]=true;i++;j++}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++}

function confetti(){const c=$('#cf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const cols=['#2557D6','#7C4DFF','#16A34A','#F5A524','#FF6B8B'];

 (function t(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.vy+=.33;p.x+=p.vx;p.y+=p.vy;p.a+=.15;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});if(++f<160)requestAnimationFrame(t);else x.clearRect(0,0,c.width,c.height)})()}

function buildQuiz(it){const ws=it.ty==='test'?it.u.lessons.flatMap(l=>l.words.map(w=>WORD[w[0]])):it.l.words.map(w=>WORD[w[0]]);const pool=Object.values(WORD);
 const ss=it.ty==='test'?it.u.lessons.flatMap(l=>l.s):it.l.s;const N=it.ty==='test'?10:6;const sel=shuf(ws).slice(0,N);const types=['mean','cloze','listen','en','cloze','mean','listen','vi2en','cloze','mean'];
 return sel.map((w,i)=>{const t=types[i%types.length];const ds=shuf(pool.filter(x=>x!==w&&x.vi!==w.vi)).slice(0,3);
  if(t==='vi2en'||t==='en'){const s=pick(ss);const others=shuf(ss.filter(x=>x!==s)).slice(0,0);return {t:'sent',s,opts:shuf([s[0],...mangle(s[0])]),ans:s[0]}}
  return {t,w,opts:shuf([w,...ds])}}).concat(Array.from({length:Math.max(0,N-sel.length)},()=>{const s=pick(ss);return {t:'sent',s,opts:shuf([s[0],...mangle(s[0])]),ans:s[0]}}))}
function mangle(s){const t=s.replace(/[.?!]$/,'').split(' ');const end=s.match(/[.?!]$/)?s.slice(-1):'.';const out=[];const add=c=>{const v=c.join(' ')+end;if(v!==s&&!out.includes(v))out.push(v)};
 const rep={"I'm":"I","is":"are","are":"is","to":"for","by":"in","for":"to","have":"has","was":"is","will":"would","the":"a","a":"the","in":"on","on":"in","should":"should to","finished":"finish","I've":"I","increased":"increase","dropped":"drop","changed":"change","could":"could to","usually":"usual","because":"because of","so":"so that","than":"then","better":"more good","every":"every of"};
 for(const k of shuf(Object.keys(rep))){const i=t.indexOf(k);if(i>=0){const c=t.slice();c[i]=rep[k];add(c)}if(out.length>=2)break}
 for(let k=1;k<t.length-1&&out.length<3;k++){const c=t.slice();[c[k],c[k+1]]=[c[k+1],c[k]];add(c)}
 for(let k=0;k<t.length&&out.length<3;k++){const c=t.slice();c.splice(k,1);add(c)}
 return out.slice(0,3)}

function fail(k,e){TEST[k]=false;TERR[k]={hint:hintFor(k,e),raw:errText(e)}}
async function listGeminiModels(){const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models?key='+encodeURIComponent(CFG.gemini)+'&pageSize=200');if(!r.ok)throw await httpErr(r);const j=await r.json();
 return (j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')).map(m=>m.name.replace(/^models\//,''))}
const vnum=m=>{const x=m.match(/(\d+(?:\.\d+)?)/);return x?parseFloat(x[1]):0};
async function autoModel(){CFG.gemini=cleanKey($('#k-gemini').value);saveCfg();if(!CFG.gemini)return toast('Dán key Gemini trước nhé');TEST.gemini='…';render();
 try{const ms=await listGeminiModels();const bad=/lite|image|tts|audio|live|exp|preview|omni|8b|embedding|gemma/i;
  const cands=[...ms.filter(m=>/flash/i.test(m)&&!bad.test(m)).sort((a,b)=>vnum(b)-vnum(a)),...ms.filter(m=>/flash/i.test(m)&&/lite/i.test(m)&&!/image|tts|audio|live|exp|preview|omni/i.test(m)).sort((a,b)=>vnum(b)-vnum(a))];
  if(!cands.length)throw {msg:'Key này không thấy model Flash nào'};let picked=null,last=null;
  for(const m of cands.slice(0,10)){CFG.gmodel=m;try{const t=await callGemini('Return ONLY JSON: {"ok":true}');JSON.parse(t.match(/\{[\s\S]*\}/)[0]);picked=m;break}catch(e){last=e}}
  if(!picked)throw last||{msg:'Không model nào trả lời'};saveCfg();setupAI();TEST.gemini=true;toast('Đã chọn model '+picked+' ✓')}
 catch(e){fail('gemini',e)}render()}
async function keyTest(k){
 if(k==='gemini'){CFG.gemini=cleanKey($('#k-gemini').value);const m=$('#k-gmodel');if(m)CFG.gmodel=m.value.trim()||'gemini-3.5-flash'}
 if(k==='groq'){const v=cleanKey($('#k-groq').value);if(v!==CFG.groq)CFG.qmodel='';CFG.groq=v}
 if(k==='sb'){CFG.sbUrl=$('#k-sbUrl').value.trim().replace(/\/rest\/v1\/?$/,'');CFG.sbKey=cleanKey($('#k-sbKey').value);if(!CFG.code)CFG.code=newCode()}
 saveCfg();setupAI();setupSync();TEST[k]='…';render();
 try{if(k==='gemini'){if(!CFG.gemini)throw {msg:'Chưa dán key'};const t=await callGemini('Return ONLY JSON: {"ok":true}');JSON.parse(t.match(/\{[\s\S]*\}/)[0])}
  else if(k==='groq'){if(!CFG.groq)throw {msg:'Chưa dán key'};if(!/^gsk_/.test(CFG.groq))throw {msg:'Key Groq phải bắt đầu bằng gsk_. Có thể bạn dán nhầm key khác.'};CFG.qmodel=await groqPick();saveCfg();const t=await callGroq('Return ONLY JSON: {"ok":true}');JSON.parse(t.match(/\{[\s\S]*\}/)[0])}
  else{await push(JSON.stringify(S));await pull()}
  TEST[k]=true;toast('Kết nối thành công ✓')}
 catch(e){fail(k,e);toast(TERR[k].hint)}
 render()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
 if(a==='kt')keyTest(b.dataset.k);
 else if(a==='gmodels')autoModel();
 else if(a==='groqoff'){CFG.groq='';CFG.qmodel='';TEST.groq=null;saveCfg();setupAI();render();toast('Đã bỏ Groq, chỉ dùng Gemini')}
 else if(a==='copy'){navigator.clipboard.writeText(b.dataset.t).then(()=>toast('Đã copy ✓'),()=>toast('Không copy được, hãy bôi đen để copy'))}
 else if(a==='exportcfg'){if(!CFG.code&&sbOn())CFG.code=newCode();const s=btoa(unescape(encodeURIComponent(JSON.stringify(CFG))));navigator.clipboard.writeText(s).then(()=>toast('Đã copy mã cài đặt ✓'),()=>{const i=$('#k-import');i.value=s;i.select();toast('Bôi đen sẵn rồi, bấm Ctrl+C')})}
 else if(a==='importcfg'){try{const c=JSON.parse(decodeURIComponent(escape(atob($('#k-import').value.trim()))));Object.assign(CFG,c);saveCfg();setupAI();setupSync();toast('Đã nhập cài đặt ✓');pull().catch(()=>{}).then(render)}catch(x){toast('Mã cài đặt không hợp lệ')}}
 else if(a==='backup'){const bl=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const u=URL.createObjectURL(bl);const l=document.createElement('a');l.href=u;l.download='english-phuong-'+dk()+'.json';l.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
});
document.addEventListener('change',e=>{if(e.target.id==='restore'){const f=e.target.files[0];if(!f)return;f.text().then(t=>{const r=JSON.parse(t);S=Object.assign(JSON.parse(JSON.stringify(DEF)),r);save();toast('Đã khôi phục ✓');render()}).catch(()=>toast('File không hợp lệ'))}});
const SES_busy=()=>/-(prac|quiz|test)$/.test(route)||route==='chat';
async function initCaps(){setupAI();setupSync();caps.dict=makeDict();
 const dc=caps.dict;if(dc){dc.onFinal(({text})=>{SP.heard=(SP.heard?SP.heard+' ':'')+text;const it=SP.list[SP.i%SP.list.length];SP.res=diffWords(it.s[0],SP.heard);touch();save();if(route==='speak')render()});
  dc.onPartial(({text})=>{const el=document.querySelector('.wave+div');if(el)el.textContent='“'+text+'”'});dc.onState(({state})=>{SP.on=state==='listening';if(route==='speak')render()})}
 if(route==='speak')render();try{await pull()}catch(e){}
 window.addEventListener('focus',()=>{if(!SES_busy())pull().catch(()=>{})})}
try{const raw=localStorage.getItem('epw');if(raw)S=Object.assign(S,JSON.parse(raw))}catch(e){}
save();show();initCaps();
if(!CFG.gemini&&!CFG.groq&&!location.hash)setTimeout(()=>toast('Lần đầu dùng? Vào ⚙️ Cài đặt để kết nối AI miễn phí.'),900);
</script>

 <div class="row" style="margin-top:14px"><button class="btn s" data-act="dlearn" data-i="${i}" ${x.done?'disabled':''}>${x.done?'✓ Đã học':'✓ Mình đã học xong phần này'}</button>${x.done?'<span class="xs mut">Các từ đã vào lịch ôn. Ngày mai sẽ kiểm tra lại.</span>':''}</div>`}
function mcqHTML(x,i,n){const r=x.res;return `${n}<div class="q">${x.q}</div>${x.say?`<div style="margin:-4px 0 10px">${spk(x.say,.9)}</div>`:''}<div class="opts">${x.opts.map((o,k)=>`<button class="op ${r?(k===x.ans?'right':k===x.pick?'wrong':''):''}" data-act="dmcq" data-i="${i}" data-k="${k}" ${r?'disabled':''}>${esc(o)}</button>`).join('')}</div>${r?`<div class="fbk ${r.ok?'ok':'no'}">${r.ok?'<b>Chính xác!</b> ':'<b>Chưa đúng.</b> '}${x.exp||''}${r.ok?'':'<div class="xs" style="margin-top:4px">Câu này sẽ quay lại ở các ngày sau.</div>'}</div>`:''}`}
function readHTML(x,i,n){const d=x.d,p=S.dpack[d]&&S.dpack[d].read;
 if(!p)return `${n}${TD.rbusy?'<div class="sm mut"><span class="spin"></span> AI đang viết bài đọc theo chủ đề hôm nay…</div>':!caps.sample?`<div class="fbk in">Phần đọc cần AI (Gemini miễn phí) để tạo bài theo chủ đề. Vào ⚙️ Cài đặt để kết nối, hoặc bỏ qua hôm nay.</div><button class="btn gh s" style="margin-top:8px" data-act="dskipread" data-i="${i}">Bỏ qua phần đọc</button>`:`${TD.rerr?`<div class="fbk no">${esc(TD.rerr)}</div>`:''}<button class="btn s" data-act="dgenread" data-i="${i}">Tạo bài đọc</button> <button class="btn gh s" data-act="dskipread" data-i="${i}">Bỏ qua</button>`}`;
 x.ans=x.ans||{};const r=x.res;const all=(p.qs||[]).every((q,k)=>x.ans[k]!=null);
 return `${n}<div class="row"><h3 class="sp" style="margin:0">${esc(p.title||'Reading')}</h3>${spk(p.text,.9)}${spk(p.text,.7)}</div><div class="rtext en">${esc(p.text).split(/\n+/).map(t=>`<p>${t}</p>`).join('')}</div>
 <details class="sm" style="margin:6px 0 10px"><summary>Xem bản dịch tiếng Việt</summary><div style="margin-top:6px">${esc(p.vi||'')}</div></details>
 ${(p.glossary||[]).length?`<div class="hints">${p.glossary.map(g=>`<span><b>${esc(g[0])}</b> · ${esc(g[1])}</span>`).join('')}</div>`:''}
 ${(p.qs||[]).map((q,k)=>`<div style="margin-top:14px"><div class="q" style="font-size:16px">${k+1}. ${esc(q.q)}</div><div class="opts">${q.opts.map((o,j)=>`<button class="op ${r?(j===+q.a?'right':j===x.ans[k]?'wrong':''):x.ans[k]===j?'sel':''}" data-act="drq" data-i="${i}" data-q="${k}" data-k="${j}" ${r?'disabled':''}>${esc(o)}</button>`).join('')}</div>${r?`<div class="xs mut" style="margin-top:4px">💡 ${esc(q.why||'')}</div>`:''}</div>`).join('')}
 ${r?`<div class="fbk ${r.ok?'ok':'in'}">${r.html}</div>`:`<button class="btn s" style="margin-top:12px" data-act="drsub" data-i="${i}" ${all?'':'disabled'}>Nộp bài</button>`}`}
async function genRead(d){const T=dayTopic(d),L=dayLesson(d);TD.rbusy=true;TD.rerr=null;rexK('read');
 try{const r=await ai(`Write a short reading text for a Vietnamese learner at B2 level (aiming IELTS 6.5). Topic: ${T.en}. Make it natural and interesting (a blog post, a message to a friend, or a short story), 110-140 words, in 2 paragraphs. Use the structure "${L.st.p}" at least once, and naturally include some of these phrases: ${T.p.map(p=>p[0]).join(' | ')}.
Return ONLY JSON: {"title":"short English title","text":"the passage, paragraphs separated by \\n","vi":"Vietnamese translation","glossary":[["word or phrase from the text","Vietnamese meaning"]],"qs":[{"q":"English question","opts":["A","B","C","D"],"a":0,"why":"1-2 câu tiếng Việt giải thích vì sao đáp án đúng, dẫn ý trong bài"}]} with 5 glossary items and 3 questions (main idea, a detail, vocabulary in context). The "why" fields must be in Vietnamese.`);
  if(r&&r.text&&Array.isArray(r.qs)){S.dpack[d]={read:r};save()}else TD.rerr='AI trả về chưa đúng định dạng, bấm tạo lại nhé.'}catch(e){TD.rerr=aiMsg(e)}TD.rbusy=false;rexK('read')}
function rexK(k){if(!W.list)return;const i=W.list.findIndex(x=>x.k===k);if(i>=0)rex(i)}
function shadowHTML(x,i,n){const r=x.res;const on=DD.on&&DD.i===i;
 return `${n}<div class="sm mut" style="margin-bottom:8px">Nghe rồi đọc to theo (shadowing). Bấm micro và đọc, app chấm từng từ.</div><div class="sw" style="font-size:21px;margin:6px 0">${r&&r.d?r.d.toks.map((t,k)=>`<span class="${r.d.ok[k]?'g':'r'}">${esc(t)}</span>`).join(' '):esc(x.s[0])}</div><div class="sm mut">${esc(x.s[1])}</div>
 <div class="row" style="margin-top:10px">${spk(x.s[0])}${spk(x.s[0],.7)}${caps.dict?`<button class="btn ${on?'':'out'} s" data-act="dmic" data-i="${i}">${on?'⏹ Dừng':'🎙️ Đọc'}</button>`:`<button class="btn out s" data-act="dshdone" data-i="${i}" ${x.done?'disabled':''}>Mình đã đọc theo 3 lần</button>`}</div>
 ${on?'<div class="xs mut" style="margin-top:6px">Đang nghe…</div>':''}${x.heard?`<div class="xs mut" style="margin-top:6px">App nghe được: “${esc(x.heard)}”</div>`:''}${r?`<div class="fbk ${r.ok?'ok':'in'}">${r.html}</div>`:''}${!caps.dict?'<div class="xs mut" style="margin-top:6px">Micro chấm điểm chạy trên Chrome/Edge (máy tính, Android).</div>':''}`}
function spqHTML(x,i,n){const r=x.res;const on=DD.on&&DD.i===i;const dis=r?'disabled':'';
 return `${n}<div class="row" style="gap:10px"><span style="font-size:28px">🗣️</span><div class="sp"><div class="en" style="font-size:19px">${esc(x.q)}</div><div class="xs mut">${esc(x.qv)}</div></div>${spk(x.q)}</div>
 <div class="frame" style="margin-top:10px">Nói 3–4 câu. Bấm micro để nói (chữ sẽ hiện vào ô), hoặc gõ nếu không dùng được micro.</div>
 <textarea id="in${i}" rows="3" ${dis} placeholder="Câu trả lời của bạn…">${esc(x.v||'')}</textarea><div class="row" style="margin-top:10px">${caps.dict&&!r?`<button class="btn ${on?'':'out'} s" data-act="dmic" data-i="${i}">${on?'⏹ Dừng':'🎙️ Nói'}</button>`:''}<button class="btn s" data-act="xcheck" data-i="${i}" ${dis||x.busy?'disabled':''}>${x.busy?'<span class="spin"></span> Đang chữa':'Nhờ AI chữa'}</button>${r?`<button class="btn gh s" data-act="xretry" data-i="${i}">Nói lại</button>`:''}</div>${r?`<div class="fbk ${r.cls||'in'}">${r.html}</div>`:''}`}
function roleHTML(x,i,n){const R=x.R;const rec=dayRec(x.d);
 return `${n}<div class="row" style="gap:14px"><span style="font-size:46px">${R.emo}</span><div class="sp"><h3 style="margin:0">${esc(R.name)}</h3><div class="xs mut">${esc(R.who)}</div></div></div><div class="en" style="margin:12px 0;font-size:17px;font-style:italic">“${esc(R.open)}”</div><div class="sm"><b>Nhiệm vụ:</b><br>${R.goals.map(g=>'• '+esc(g)).join('<br>')}</div>
 <div class="row" style="margin-top:12px"><button class="btn s" data-act="drole" data-i="${i}">💬 Vào chat với vai này</button><button class="btn gh s" data-act="dreroll" data-i="${i}">🎲 Đổi vai khác</button>${rec.sec.role?'<span class="pill g">✓ Đã chat</span>':''}</div><div class="xs mut" style="margin-top:6px">Phần thưởng thêm, không bắt buộc. Gửi ít nhất 3 tin nhắn để tính là đã hoàn thành.</div>`}
window.DICT_HOOK=null;
function dmic(i){const x=W.list[i];if(!caps.dict)return toast('Micro chỉ chạy trên Chrome/Edge');if(DD.on){try{caps.dict.stop()}catch(e){}return}
 DD.i=i;if(x.k==='shadow'){x.heard='';x.res=null}
 window.DICT_HOOK=text=>{const y=W.list&&W.list[DD.i];if(!y)return;if(y.k==='shadow'){y.heard=(y.heard?y.heard+' ':'')+text;const d=diffWords(y.s[0],y.heard);const ok=d.pct>=80;y.res={ok,d,html:`<b>${d.pct}% số từ nghe rõ.</b> ${ok?'Phát âm rất ổn!':'Nghe chậm 🐢 từ màu đỏ rồi đọc lại nhé.'}`};y.done=true;snd(ok?'ok':'no');touch();save()}else{const t=$('#in'+DD.i);y.v=((t?t.value:y.v||'')+' '+text).trim()}rex(DD.i)};
 window.DICT_STATE=st=>{DD.on=st==='listening';if(W.list&&W.list[DD.i])rex(DD.i)};
 try{caps.dict.start().catch(()=>{toast('Chưa bật được micro');DD.on=false;rex(i)})}catch(e){toast('Chưa bật được micro')}}

/* ---------- 6. Films (mini scenes) ---------- */
const FS={id:null,vi:true,play:null};
function vFilms(){const f=FILMS.find(x=>x.id===FS.id);
 if(!f)return `<div class="page" style="max-width:1000px"><span class="tag">Cảnh phim mini</span><h1>Học qua thoại nhân vật</h1><p class="mut" style="max-width:720px">Những cảnh phim ngắn viết riêng cho bạn: lãng mạn, trinh thám, viễn tưởng, K-drama… Nghe thoại 2 giọng, xem câu đáng học, rồi tự dịch lại câu thoại. Thích câu nào trong phim thật thì dán vào mục <a href="#quotes">Câu hay</a> để AI phân tích.</p>
 <div class="fgrid">${FILMS.map(x=>`<button class="fcard lift" data-act="fopen" data-f="${x.id}"><div class="fart">${sceneArt(x.art,x.id)}<span class="femo">${x.emo}</span></div><div style="padding:12px 14px;text-align:left"><span class="tag">${esc(x.genre)}</span><h3 style="margin:4px 0 2px">${esc(x.title)}</h3><div class="xs mut">${x.chars.map(c=>esc(c.n)).join(' & ')} · ${x.lines.length} câu thoại</div></div></button>`).join('')}</div></div>`;
 if(!W.list||W.fid!==f.id){W.fid=f.id;W.simple=true;W.day=null;const L={title:f.title,words:f.keys.map(k=>[k[0].replace(/…/g,'').trim(),k[1]]),st:{p:f.keys[0][0]}};const pk=shuf(f.lines.filter(l=>l[1].split(' ').length>=6)).slice(0,2);W.list=pk.map((l,j)=>({k:'trans',sec:j?null:'Dịch lại câu thoại',s:[l[1],l[2]],l:L}))}
 return `<div class="page" style="max-width:860px"><button class="btn gh s" data-act="fback">← Tất cả cảnh phim</button>
 <div class="dhero" style="margin-top:12px"><div class="dart">${sceneArt(f.art,'fv'+f.id)}</div><div class="dhin"><span class="tag" style="color:rgba(255,255,255,.85)">${esc(f.genre)}</span><h1 style="margin:4px 0;color:#fff">${f.emo} ${esc(f.title)}</h1></div></div>
 <div class="row wrap" style="gap:8px;margin:14px 0"><button class="btn s" data-act="fplay">${FS.play?'⏹ Dừng':'▶️ Phát cả cảnh'}</button><button class="btn gh s" data-act="fvi">${FS.vi?'Ẩn':'Hiện'} tiếng Việt</button><span class="xs mut">Mẹo: nghe 1 lần có tiếng Việt, lần 2 ẩn đi và nhại theo.</span></div>
 <div class="fscene">${f.lines.map((l,k)=>{const c=f.chars[l[0]];return `<div class="fl ${l[0]?'r':''}" id="fl${k}"><div class="fav" style="background:${c.c}">${esc(c.n[0])}</div><div class="fb"><div class="xs" style="font-weight:700;color:${c.c}">${esc(c.n)}</div><div class="en">${esc(l[1])}</div>${FS.vi?`<div class="xs mut">${esc(l[2])}</div>`:''}</div>${spk(l[1],.9)}</div>`}).join('')}</div>
 <h2>Câu đáng học</h2>${f.keys.map(k=>`<div class="card" style="padding:12px 16px;margin-bottom:8px"><div class="row" style="gap:8px">${spk(k[0].replace(/…/g,''),.9)}<div class="sp"><b class="en">${esc(k[0])}</b> · <span class="sm">${esc(k[1])}</span>${k[2]?`<div class="xs mut">${esc(k[2])}</div>`:''}</div><button class="save" data-act="savep" data-t="${esc(k[0])}" data-v="${esc(k[1])}">⭐ Lưu</button></div></div>`).join('')}
 ${W.list.map((x,i)=>`${x.sec?`<h2>${x.sec}</h2>`:''}<div class="ex-card" id="x${i}">${exHTML(x,i)}</div>`).join('')}</div>`}
function playScene(f){const synth=window.speechSynthesis;if(!synth)return toast('Trình duyệt chưa có giọng đọc');synth.cancel();
 const vs=synth.getVoices().filter(v=>/^en/i.test(v.lang));const pickV=ci=>{if(!vs.length)return null;const pref=ci?vs.filter(v=>/male|david|daniel|george|guy|mark|james|ryan/i.test(v.name)&&!/female/i.test(v.name)):vs.filter(v=>/female|zira|samantha|susan|hazel|aria|jenny|libby|sonia|emma/i.test(v.name));return (pref[0]||vs[ci%vs.length])};
 let k=0;FS.play=true;render();const next=()=>{document.querySelectorAll('.fl.on').forEach(e=>e.classList.remove('on'));if(!FS.play||k>=f.lines.length){FS.play=null;render();return}const l=f.lines[k];const el=$('#fl'+k);if(el){el.classList.add('on');el.scrollIntoView({block:'nearest',behavior:'smooth'})}
  const u=new SpeechSynthesisUtterance(l[1]);u.lang='en-US';const v=pickV(l[0]);if(v)u.voice=v;u.pitch=l[0]?.9:1.15;u.rate=.92;u.onend=()=>{k++;setTimeout(next,350)};u.onerror=()=>{FS.play=null;render()};synth.speak(u)};next()}

/* ---------- click handlers for new actions ---------- */
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,i=+b.dataset.i;
 switch(a){
 case 'dday':TD.d=+b.dataset.d;TD.rerr=null;render();window.scrollTo({top:0});break;
 case 'dgo':{const el=document.getElementById('sec-'+b.dataset.s);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});break}
 case 'dlearn':{const x=W.list[i];x.done=true;x.L.words.forEach(w=>{if(!S.v[w[0]])S.v[w[0]]={box:0,due:addDays(1)}});touch();save();snd('ok');rex(i);break}
 case 'dmcq':{const x=W.list[i];if(x.res)return;x.pick=+b.dataset.k;const ok=x.pick===x.ans;x.res={ok};x.done=true;missMark(x,ok);touch();save();snd(ok?'ok':'no');rex(i);break}
 case 'drq':{const x=W.list[i];if(x.res)return;x.ans=x.ans||{};x.ans[+b.dataset.q]=+b.dataset.k;rex(i);break}
 case 'drsub':{const x=W.list[i];const p=S.dpack[x.d].read;const c=p.qs.filter((q,k)=>x.ans[k]===+q.a).length;x.res={ok:c===p.qs.length,html:`<b>Đúng ${c}/${p.qs.length} câu.</b> ${c===p.qs.length?'Đọc hiểu rất tốt!':'Xem giải thích dưới mỗi câu nhé.'}`};x.done=true;touch();save();snd(c===p.qs.length?'ok':'no');rex(i);break}
 case 'dgenread':TD.rerr=null;genRead(W.list[i].d);break;
 case 'dskipread':{const x=W.list[i];x.done=true;x.res={ok:true,cls:'in',html:'Đã bỏ qua phần đọc hôm nay.'};rex(i);break}
 case 'dshdone':{const x=W.list[i];x.done=true;x.res={ok:true,html:'Tốt lắm! Shadowing đều đặn giúp nói trôi chảy hơn.'};touch();save();rex(i);break}
 case 'dmic':dmic(i);break;
 case 'drole':{const x=W.list[i];ensureRoleScen(x.R);TD.roleFor={d:x.d,id:x.R.id};chatStart(x.R.id);go('chat');break}
 case 'dreroll':{const x=W.list[i];const cur=x.R.id;const others=ROLES.filter(r=>r.id!==cur);const R=pick(others);dayRec(x.d).role=R.id;save();x.R=R;ensureRoleScen(R);rex(i);toast('Vai mới: '+R.name);break}
 case 'fopen':FS.id=b.dataset.f;W={};render();window.scrollTo({top:0});break;
 case 'fback':FS.id=null;FS.play=null;try{speechSynthesis.cancel()}catch(e){}W={};render();break;
 case 'fvi':FS.vi=!FS.vi;render();break;
 case 'fplay':{if(FS.play){FS.play=null;try{speechSynthesis.cancel()}catch(e){}render()}else playScene(FILMS.find(x=>x.id===FS.id));break}
 }});
const _chSend=chSend;chSend=async function(t){await _chSend(t);try{const R=TD.roleFor;if(R&&CH.sid===R.id&&CH.msgs.filter(m=>m.r==='me').length>=3){const rec=dayRec(R.d);if(!rec.sec.role){rec.sec.role=dk();save();toast('🎭 Đã hoàn thành vai diễn hôm nay!')}}}catch(e){}};
